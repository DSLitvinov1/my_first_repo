name: Neurofactory CORE claimed lease + signed HOST witness strict binding
on:
  push:
    branches: [neurofactory-p0-core-lease-signed-witness-bind-20261102]
    paths:
      - 'bridge/neurofactory/one_pc_candidate/core_readonly_observer.py'
      - 'bridge/neurofactory/one_pc_candidate/protected_host_core_witness_binding.py'
      - 'bridge/neurofactory/one_pc_candidate/test_protected_host_core_witness_binding.py'
      - '.github/workflows/neurofactory-p0-core-signed-witness-binding-ci.yml'
permissions:
  contents: read
jobs:
  exact_core_task_and_signed_witness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      GIT_AUTHOR_NAME: 'NF Test'
      GIT_AUTHOR_EMAIL: 'ci@example.invalid'
      GIT_COMMITTER_NAME: 'NF Test'
      GIT_COMMITTER_EMAIL: 'ci@example.invalid'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Isolated crypto and actual CORE SQLite signed witness regression
        shell: bash
        run: |
          python -m venv .nf-witness-test-env
          if [ -x .nf-witness-test-env/bin/python ]; then
            PY=.nf-witness-test-env/bin/python
          else
            PY=.nf-witness-test-env/Scripts/python.exe
          fi
          "$PY" -m pip install --no-input --disable-pip-version-check 'cryptography==46.0.3'
          "$PY" -B -m unittest discover -s bridge/neurofactory/one_pc_candidate -p test_protected_host_core_witness_binding.py -v
      - name: Assert no changes outside disposable test directories
        shell: bash
        run: git diff --exit-code
