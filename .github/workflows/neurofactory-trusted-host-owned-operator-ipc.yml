name: Neurofactory HOST signer Unix credential-check receiver
on:
  push:
    branches:
      - neurofactory-trusted-host-owned-20261015
    paths:
      - bridge/neurofactory/trusted_host/offline_operator_ipc.py
      - bridge/neurofactory/trusted_host/test_offline_operator_ipc.py
      - bridge/neurofactory/trusted_host/offline_signer_scope_guard.py
      - bridge/neurofactory/trusted_host/test_offline_signer_scope_ipc.py
      - .github/workflows/neurofactory-trusted-host-owned-operator-ipc.yml
permissions:
  contents: read
jobs:
  isolated-uid-unix-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      NF_OPERATOR_ANCHOR_FIXTURE_ONLY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ephemeral host-only signer and restricted consumer OS principals
        run: |
          sudo groupadd --system nf_operator_ipc
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin nf_signer
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin nf_db_actor
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin nf_unapproved_client
          sudo usermod -aG nf_operator_ipc nf_signer
          sudo usermod -aG nf_operator_ipc nf_db_actor
          sudo usermod -aG nf_operator_ipc nf_unapproved_client
          test "$(id -u nf_signer)" != "$(id -u nf_db_actor)"
      - name: Stage only public program bytes in temporary runner directory
        run: |
          python3 -m venv /tmp/nf-operator-ipc-venv
          /tmp/nf-operator-ipc-venv/bin/python -m pip install --no-input --disable-pip-version-check cryptography==46.0.3
          mkdir -p /tmp/nf-ipc-source
          cp bridge/neurofactory/trusted_host/offline_operator_anchor.py /tmp/nf-ipc-source/
          cp bridge/neurofactory/trusted_host/offline_operator_ipc.py /tmp/nf-ipc-source/
          cp bridge/neurofactory/trusted_host/offline_signer_scope_guard.py /tmp/nf-ipc-source/
          cp bridge/neurofactory/trusted_host/signed_effect_permit.py /tmp/nf-ipc-source/
      - name: Verify read-only SO_PEERCRED Unix socket signer owner and rollback denial
        run: |
          git rev-parse HEAD
          NF_OPERATOR_IPC_STAGED_SOURCE=/tmp/nf-ipc-source/offline_operator_ipc.py NF_OPERATOR_TEST_PYTHON=/tmp/nf-operator-ipc-venv/bin/python /tmp/nf-operator-ipc-venv/bin/python -B -m unittest discover -s bridge/neurofactory/trusted_host -p 'test_offline_signer_scope_ipc.py' -v
          NF_OPERATOR_IPC_STAGED_SOURCE=/tmp/nf-ipc-source/offline_operator_ipc.py NF_OPERATOR_TEST_PYTHON=/tmp/nf-operator-ipc-venv/bin/python /tmp/nf-operator-ipc-venv/bin/python -B -m unittest discover -s bridge/neurofactory/trusted_host -p 'test_offline_operator_ipc.py' -v
