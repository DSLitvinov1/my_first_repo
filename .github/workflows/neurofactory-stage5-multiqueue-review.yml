name: Neurofactory Stage5 Independent Qwen Safety Review
on:
  push:
    branches: [neurofactory-public-lab-20261012]
    paths:
      - '.github/workflows/neurofactory-stage5-multiqueue-review.yml'
permissions:
  contents: read
concurrency:
  group: neurofactory-stage5-independent-review-only
  cancel-in-progress: false
jobs:
  independent_approval:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free local Qwen3 reviewer with no GitHub write token
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > "$RUNNER_TEMP/nf5-review-ollama.log" 2>&1 &)
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3:4b
      - name: Independent Stage5 queue security and provenance review
        env:
          OLLAMA_MAX_LOADED_MODELS: "1"
          OLLAMA_NUM_PARALLEL: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B bridge/neurofactory/development/stage5_multiqueue_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neurofactory-stage5-independent-queue-review
          path: bridge/neurofactory/development/stage5-multiqueue-review-result.json
          if-no-files-found: warn
