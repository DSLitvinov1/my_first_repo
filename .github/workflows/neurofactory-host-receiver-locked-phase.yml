name: Neurofactory HOST ephemeral locked receiver proof
on:
  push:
    branches: [neurofactory-host-receiver-lock-audit-20261017]
    paths:
      - bridge/neurofactory/trusted_host/offline_fenced_file_receiver.py
      - bridge/neurofactory/trusted_host/test_receiver_locked_phase.py
      - .github/workflows/neurofactory-host-receiver-locked-phase.yml
permissions:
  contents: read
jobs:
  host-fenced-locked-phase:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nf_test
          POSTGRES_PASSWORD: nf_test_ephemeral_only
          POSTGRES_DB: nf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nf_test -d nf_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      NF_HOST_RECEIVER_FIXTURE_ONLY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install isolated ephemeral test libraries
        run: |
          python3 -m venv .nf-locked-host
          .nf-locked-host/bin/python -m pip install --disable-pip-version-check --no-input 'psycopg[binary]==3.2.6' 'cryptography==46.0.3'
      - name: Test previous receiver regression and new row-lock race denial
        run: |
          .nf-locked-host/bin/python -B -m unittest discover -s bridge/neurofactory/trusted_host -p 'test_offline_fenced_file_receiver.py' -v
          .nf-locked-host/bin/python -B -m unittest discover -s bridge/neurofactory/trusted_host -p 'test_receiver_locked_phase.py' -v
