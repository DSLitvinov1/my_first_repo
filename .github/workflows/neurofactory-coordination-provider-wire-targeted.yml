name: Neurofactory coordinator provider wire targeted
on:
  push:
    branches:
      - neurofactory-coordinator-mvp-status-20261015
    paths:
      - bridge/neurofactory/coordination/mvp_provider_wire.py
      - bridge/neurofactory/coordination/test_mvp_provider_wire.py
      - .github/workflows/neurofactory-coordination-provider-wire-targeted.yml
permissions:
  contents: read
jobs:
  mapper-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute only new provider wire contract scenarios
        run: python3 -B -m unittest discover -s bridge/neurofactory/coordination -p 'test_mvp_provider_wire.py' -v
