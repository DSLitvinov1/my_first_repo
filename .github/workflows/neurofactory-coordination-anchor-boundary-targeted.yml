name: Neurofactory coordinator CORE anchor boundary targeted
on:
  push:
    branches:
      - neurofactory-coordinator-mvp-status-20261015
    paths:
      - bridge/neurofactory/coordination/mvp_core_anchor_boundary.py
      - bridge/neurofactory/coordination/test_mvp_core_anchor_boundary.py
      - .github/workflows/neurofactory-coordination-anchor-boundary-targeted.yml
permissions:
  contents: read
jobs:
  boundary-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact CORE anchor mismatch and no-release boundary
        run: python3 -B -m unittest discover -s bridge/neurofactory/coordination -p 'test_mvp_core_anchor_boundary.py' -v
