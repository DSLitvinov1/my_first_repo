name: Neurofactory Stage5 Independent Focused Security Review
# Review complete untruncated modules and the corrected remote recovery implementation.
on:
  push:
    branches: [neurofactory-stage5-security-check-20261013]
    paths: ['.github/workflows/neurofactory-stage5-independent-focused.yml']
permissions:
  contents: read
concurrency:
  group: neurofactory-stage5-security-focused
  cancel-in-progress: false
jobs:
  deterministic_recovery_gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Real Windows-equivalent recovery and anti-replay contracts
        env:
          PYTHONPATH: bridge/neurofactory/development
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -m unittest discover -s bridge/neurofactory/development -p test_stage5_remote_journal.py -v
          python -B -m unittest discover -s bridge/neurofactory/development -p test_stage5_development_queue.py -v
          python -B -m unittest discover -s bridge/neurofactory/development -p test_stage4_queue.py -v
  review:
    needs: deterministic_recovery_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch free local independent Qwen3
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > "$RUNNER_TEMP/nf5-sec.log" 2>&1 &)
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3:4b
      - name: Independent code-group safety review, no write credentials
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OLLAMA_NUM_PARALLEL: '1'
          OLLAMA_MAX_LOADED_MODELS: '1'
        run: python -B bridge/neurofactory/development/stage5_independent_security_split.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neurofactory-stage5-independent-structured-security
          path: bridge/neurofactory/development/stage5-independent-security-outcome.json
          if-no-files-found: warn
