name: Neurofactory Stage4 Bridge Adapter Independent Review
on:
  push:
    branches: [neurofactory-resilience-bridge-adapter-20261013]
    paths:
      - 'bridge/neurofactory/development/stage4_bridge_adapter.py'
      - 'bridge/neurofactory/development/test_stage4_bridge_adapter.py'
      - 'bridge/neurofactory/development/stage4_bridge_adapter_review.py'
      - '.github/workflows/neurofactory-stage4-bridge-adapter-review.yml'
permissions:
  contents: read
concurrency:
  group: neurofactory-new-adapter-independent-review
  cancel-in-progress: false
jobs:
  second_agent:
    if: ${{ github.repository == 'DSLitvinov1/my_first_repo' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    env:
      PYTHONPATH: bridge/neurofactory/development
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_KEEP_ALIVE: '0'
    steps:
      - name: Checkout only isolated candidate and do not retain credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require successful regression on current source before second opinion
        run: |
          python -B -m unittest discover -s bridge/neurofactory/development -p 'test_stage4_bridge_adapter.py' -v
          python -B -m unittest discover -s bridge/neurofactory/development -p 'test_stage4_queue.py' -v
          python -B -m unittest discover -s bridge/neurofactory/development -p 'test_durable_checkpoint.py' -v
      - name: Start free Qwen3 reviewer without publication credentials
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > "$RUNNER_TEMP/neurofactory-adapter-review.log" 2>&1 &)
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags > /dev/null
          ollama pull qwen3:4b
      - name: Independent second-agent approval of exact new source
        run: python -B bridge/neurofactory/development/stage4_bridge_adapter_review.py
      - name: Retain reviewer report for verification; no automatic merge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurofactory-adapter-independent-review
          path: ${{ runner.temp }}/neurofactory-stage4-adapter-review.json
          if-no-files-found: ignore
          retention-days: 7
