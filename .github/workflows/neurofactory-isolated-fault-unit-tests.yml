name: Neurofactory Isolated Fault Unit Tests
on:
  push:
    branches: [neurofactory-stage5-isolated-acceptance-20261013]
    paths:
      - .github/workflows/neurofactory-isolated-fault-unit-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Isolated recovery unit tests
        run: PYTHONPATH=bridge/neurofactory/development python3 -m unittest discover -s bridge/neurofactory/development -p test_stage5_isolated_failure_supervisor.py -v
