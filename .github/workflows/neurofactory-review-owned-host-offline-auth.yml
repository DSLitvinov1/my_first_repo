name: Neurofactory REVIEW trusted host ephemeral offline-authority negative
on:
  push:
    branches:
      - neurofactory-review-owned-20261013
    paths:
      - .github/workflows/neurofactory-review-owned-host-offline-auth.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ephemeral_database_negative:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nf_test
          POSTGRES_USER: nf_review
          POSTGRES_PASSWORD: ephemeral_review_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nf_review -d nf_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 8
    steps:
      - name: Checkout only REVIEW negative
        uses: actions/checkout@v4
        with:
          ref: neurofactory-review-owned-20261013
          persist-credentials: false
      - name: Save test outside audited checkout
        run: cp bridge/neurofactory/development/review_owned/independent_trusted_host_offline_mode_20261015.py "$RUNNER_TEMP/review_offline_host.py"
      - name: Checkout exact offline TRUSTED HOST candidate
        uses: actions/checkout@v4
        with:
          ref: d3032289c2b8ddd3c043e7f47640bd77324ff591
          persist-credentials: false
          clean: true
      - name: Confirm exact audited host SHA
        run: test "$(git rev-parse HEAD)" = "d3032289c2b8ddd3c043e7f47640bd77324ff591"
      - name: Install minimal local PostgreSQL client for isolated fixture
        run: python3 -m pip -q install 'psycopg[binary]>=3.2,<3.4'
      - name: One self-authorized offline fixture negative, no live API
        env:
          REVIEW_SYNTHETIC_PG_DSN: "postgresql://nf_review:ephemeral_review_only@localhost:5432/nf_test"
        run: python3 -B "$RUNNER_TEMP/review_offline_host.py" "$GITHUB_WORKSPACE/bridge/neurofactory/trusted_host"
      - name: Verify audited checkout not modified
        run: git diff --exit-code
