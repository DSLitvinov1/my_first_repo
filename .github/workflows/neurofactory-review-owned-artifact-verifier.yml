name: Neurofactory REVIEW Independent GitHub Artifact Attestation Tests
on:
  push:
    branches: [neurofactory-review-owned-20261013]
    paths:
      - 'bridge/neurofactory/development/review_owned/verify_qwen3_github_evidence.py'
      - 'bridge/neurofactory/development/review_owned/test_verify_qwen3_github_evidence.py'
      - 'bridge/neurofactory/development/review_owned/test_verify_qwen3_github_remote.py'
      - '.github/workflows/neurofactory-review-owned-artifact-verifier.yml'
permissions:
  contents: read
concurrency:
  group: neurofactory-review-artifact-verifier-only
  cancel-in-progress: false
jobs:
  read_only_proof_validator:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout only isolated reviewer files
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run adversarial original-run provenance and no-publication tests
        env:
          PYTHONPATH: bridge/neurofactory/development/review_owned
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -m unittest discover -s bridge/neurofactory/development/review_owned -p 'test_verify_qwen3_github_*.py' -v
      - name: Confirm reviewer cannot modify external project state
        run: |
          python -B - <<'PY'
          from pathlib import Path
          code=Path('bridge/neurofactory/development/review_owned/verify_qwen3_github_evidence.py').read_text()
          for forbidden in ('create_pull_request(', 'git push', 'github.rest.git.createRef', 'publish('):
              assert forbidden not in code, forbidden
          print('REVIEW_ONLY_READONLY_ARTIFACT_ATTESTATION_TESTS_PASS')
          PY
