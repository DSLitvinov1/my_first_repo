name: Neurofactory actual restricted Windows SCM recipient checks current CORE claimed lease
on:
  push:
    branches: [neurofactory-p0-scm-recipient-core-lease-guard-20261103]
    paths:
      - 'bridge/neurofactory/one_pc_candidate/scm_recipient_core_claim_guard.py'
      - 'bridge/neurofactory/one_pc_candidate/test_scm_recipient_core_claim_guard.py'
      - 'bridge/neurofactory/one_pc_candidate/core_readonly_observer.py'
      - 'bridge/neurofactory/trusted_host/windows_scm_sandbox_receiver.py'
      - 'bridge/neurofactory/trusted_host/windows_named_pipe_pilot_receiver.py'
      - 'bridge/neurofactory/trusted_host/test_windows_scm_two_user_recovery.py'
      - '.github/workflows/neurofactory-p0-scm-recipient-core-lease-ci.yml'
permissions:
  contents: read
jobs:
  narrow-guard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Current CORE read-only recipient negative checks
        working-directory: bridge/neurofactory/one_pc_candidate
        run: python -B -m unittest -v test_scm_recipient_core_claim_guard
      - name: No tracked changes
        run: git diff --exit-code
  actual-scm-two-principals:
    strategy:
      fail-fast: false
      matrix:
        scenario: [normal, crash-window]
    runs-on: windows-2025
    timeout-minutes: 16
    env:
      NF_WINDOWS_SCM_DISPOSABLE_ONLY: '1'
      NF_WINDOWS_CROSS_BRANCH_ACL_VERIFY: '1'
      NF_WINDOWS_REQUIRE_RESTRICTED_SERVICE_SID: '1'
      NF_ONEPC_FINAL_SIGNED_CI: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f4c424a5544749668fd2eb5657207e7873a6039a
          path: .nf_pinned_core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 681375ce0b959812fc836bf4d14abc107b58e9ca
          path: .nf_pinned_acl
          persist-credentials: false
      - name: Exact immutable current CORE pin
        shell: pwsh
        run: |
          if ((git -C .nf_pinned_core rev-parse HEAD).Trim() -cne 'f4c424a5544749668fd2eb5657207e7873a6039a') {throw 'STALE_CORE_OR_WRONG_SOURCE'}
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows') {throw 'OWNER_DEVICE_NOT_ALLOWED'}
      - name: Install ephemeral Python deps on disposable CI only
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input "pywin32==311" "cryptography==46.0.3"
      - name: Actual restricted SCM LocalService and separate UI process, signed task, pinned CORE lease, crash fencing
        shell: pwsh
        run: python -B bridge/neurofactory/trusted_host/test_windows_scm_two_user_recovery.py ${{ matrix.scenario }}
      - name: No tracked changes
        shell: pwsh
        run: git diff --exit-code
