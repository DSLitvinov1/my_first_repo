name: Neurofactory one-PC Windows separate-SID DPAPI owner signing candidate CI
on:
  push:
    branches: [neurofactory-onepc-win-owner-dpapi-controller-20261019]
    paths:
      - bridge/neurofactory/one_pc_candidate/windows_owner_controller_candidate.py
      - bridge/neurofactory/one_pc_candidate/test_windows_owner_controller_candidate.py
      - .github/workflows/neurofactory-onepc-owner-dpapi-ci.yml
permissions:
  contents: read
jobs:
  real-windows-sid-dpapi-owner-core-only:
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      NF_OWNER_SIGNER_DISPOSABLE_CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify disposable GitHub-hosted Windows and no operator PC changes
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'TEST_DISABLED_OUTSIDE_EPHEMERAL_WINDOWS' }
          python -B -m py_compile bridge/neurofactory/one_pc_candidate/windows_owner_controller_candidate.py bridge/neurofactory/one_pc_candidate/test_windows_owner_controller_candidate.py
      - name: Test temporary signer DPAPI, actual restricted second Windows SID, real signed CORE SQLite
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input "pywin32==311" "cryptography==46.0.3"
          if ($LASTEXITCODE -ne 0) { throw 'OWNER_CI_DEPENDENCIES_MISSING' }
          python -B -m unittest discover -s bridge/neurofactory/one_pc_candidate -p test_windows_owner_controller_candidate.py -v
          if ($LASTEXITCODE -ne 0) { throw 'OWNER_CI_REAL_WINDOWS_SECURITY_FAIL' }
      - name: Verify repository unchanged
        run: git diff --exit-code
