name: Work ONE personal offline pilot bundle (no deployment)
on:
  push:
    branches: [neurofactory-work-one-private-portable-20261114]
    paths:
      - 'bridge/neurofactory/one_pc_candidate/workbench/**'
      - '.github/workflows/neurofactory-work-one-private-portable.yml'
permissions:
  contents: read
jobs:
  isolated_personal_bundle:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Existing and private regression tests, no connected accounts
        shell: pwsh
        run: |
          cd bridge/neurofactory/one_pc_candidate/workbench
          python -B -m unittest -q test_workbench test_agent_one test_browser_control test_workflow_one test_toolmesh_one test_personal_readiness_one test_private_flow_one test_private_preflight_one
          if ($LASTEXITCODE -ne 0) {throw 'PERSONAL_REGRESSION_FAILED'}
      - name: Parse Windows launcher and desktop worker; validate Python/JavaScript
        shell: pwsh
        run: |
          $root='bridge/neurofactory/one_pc_candidate/workbench'
          foreach ($script in @('START_PRIVATE_WORK_ONE.ps1','desktop_worker.ps1')) {
            $tokens=$null; $errors=$null
            [Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $root $script),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {throw ('POWERSHELL_PARSE_REFUSED: '+$script)}
          }
          python -m py_compile "$root/work_server.py" "$root/private_flow_one.py" "$root/personal_readiness_one.py" "$root/private_preflight_one.py"
          if ($LASTEXITCODE -ne 0) {throw 'PYTHON_COMPILE_FAILED'}
          node --check "$root/app.js"
          if ($LASTEXITCODE -ne 0) {throw 'APP_JAVASCRIPT_FAILED'}
          node --check "$root/toolmesh.js"
          if ($LASTEXITCODE -ne 0) {throw 'TOOLMESH_JAVASCRIPT_FAILED'}
          node --check "$root/browser_worker.cjs"
          if ($LASTEXITCODE -ne 0) {throw 'BROWSER_JAVASCRIPT_FAILED'}
      - name: Build allowlisted source-only private bundle, no secrets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='bridge/neurofactory/one_pc_candidate/workbench'
          $destination='bundle_output/Work_ONE_Private'
          New-Item -Path $destination -ItemType Directory -Force | Out-Null
          $files=@(
            'work_core.py','work_server.py','agent_one.py',
            'browser_control.py','browser_typing.cjs','browser_worker.cjs',
            'workflow_one.py','desktop_one.py','desktop_worker.ps1',
            'credentials_one.py','google_oauth_one.py','service_one.py',
            'qwen_planner_one.py','llama_connector_one.py',
            'personal_readiness_one.py','private_flow_one.py',
            'index.html','styles.css','app.js','toolmesh.js',
            'package.json','package-lock.json','README.md',
            'START_PRIVATE_WORK_ONE.ps1','PERSONAL_START_README.md',
            'private_preflight_one.py'
          )
          $checksums=@{}
          foreach ($filename in $files) {
            if ($filename -match '[\\/]' -or $filename.StartsWith('.')) {
              throw 'INVALID_BUNDLE_PATH'
            }
            $path=Join-Path $root $filename
            $item=Get-Item -LiteralPath $path -Force -ErrorAction Stop
            if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw 'BUNDLE_LINK_OR_DIRECTORY_REFUSED'
            }
            if ($item.Length -gt 524288) {throw 'BUNDLE_SOURCE_TOO_LARGE'}
            $checksums[$filename]=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            Copy-Item -LiteralPath $path -Destination (Join-Path $destination $filename)
            $copyHash=(Get-FileHash -LiteralPath (Join-Path $destination $filename) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($copyHash -ne $checksums[$filename]) {throw 'BUNDLE_COPY_DIGEST_MISMATCH'}
          }
          $manifest=@{
            schema='nf.workone.personal-bundle.v1'
            source_sha=$env:GITHUB_SHA
            requires_user_authorization=$true
            installs_windows_service=$false
            contains_secrets=$false
            file_digests=$checksums
          }
          $manifest|ConvertTo-Json -Depth 8|Set-Content -LiteralPath (Join-Path $destination 'manifest.json') -Encoding UTF8
          Write-Host ("BUNDLE_VERIFIED_FILES="+$checksums.Count)
          python "$destination/private_preflight_one.py"
          if ($LASTEXITCODE -ne 0) {throw 'BUNDLE_PREFLIGHT_FAILED'}
      - name: Upload private GitHub artifact only; do not install or deploy
        uses: actions/upload-artifact@v4
        with:
          name: Neirozavod-Work-ONE-Personal-Pilot
          path: bundle_output/Work_ONE_Private/
          if-no-files-found: error
          retention-days: 7
