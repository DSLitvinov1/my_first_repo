name: Neurofactory CORE single-task targeted offline checks
on:
  push:
    branches: [neurofactory-core-queue-owned-20261013]
    paths:
      - 'bridge/neurofactory/development/core_owned/one_task_core.py'
      - 'bridge/neurofactory/development/core_owned/test_one_task_core.py'
      - 'bridge/neurofactory/development/core_owned/ONE_TASK_MVP_RU.md'
      - '.github/workflows/neurofactory-core-owned-once-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-windows-crash-path:
    name: Windows hosted only crash boundary and safe path (NO Ollama)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned candidate without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Windows subprocess dies after replace with no replay
        run: python -B -m unittest discover -v -s bridge/neurofactory/development/core_owned -p test_one_task_core.py -k killed_after_atomic_file_replace
      - name: Verify Win32 reserved device paths are rejected
        run: python -B -m unittest discover -v -s bridge/neurofactory/development/core_owned -p test_one_task_core.py -k windows_reserved_device_names
      - name: Verify no tracked modifications
        run: git diff --exit-code

  core-offline-test:
    name: deterministic single-task sandbox tests (NO Ollama)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned candidate commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Targeted Python offline tests
        env:
          NF_CORE_EVIDENCE_DIR: ${{ runner.temp }}/core-once-evidence
        run: python3 -B -m unittest discover -v -s bridge/neurofactory/development/core_owned -p test_one_task_core.py
      - name: Preserve synthetic sandbox checkpoint receipt
        uses: actions/upload-artifact@v4
        with:
          name: core-once-synthetic-receipt
          path: ${{ runner.temp }}/core-once-evidence/offline-test-checkpoint.json
          if-no-files-found: error
          retention-days: 14
      - name: Source tree remains unmodified
        run: git diff --exit-code
