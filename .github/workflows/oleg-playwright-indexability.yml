name: Oleg sites Playwright indexability audit
on:
  push:
    branches: [audit-oleg-sites-playwright-20261115]
    paths:
      - 'audits/oleg-indexing/**'
      - '.github/workflows/oleg-playwright-indexability.yml'
  pull_request:
    branches: [main]
    paths:
      - 'audits/oleg-indexing/**'
      - '.github/workflows/oleg-playwright-indexability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: audits/oleg-indexing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify guarded SEO metadata changes
        run: python -m unittest -v test_metadata_guard test_case_links_guard
      - name: Verify audit syntax
        run: |
          node --check audit.cjs
          node --check sitemap_operator.mjs
          node --check test_sitemap_operator.mjs
          node --check case_quality_audit.cjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test authenticated sitemap operator against simulated UI only
        run: node --test test_sitemap_operator.mjs
      - name: Audit public indexing eligibility without changing sites
        run: node audit.cjs
      - name: Analyze short legal cases without changing the live websites
        run: node case_quality_audit.cjs
      - name: Attach report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oleg-indexability
          path: |
            audits/oleg-indexing/oleg-indexability.json
            audits/oleg-indexing/oleg-legal-case-quality.json
          if-no-files-found: warn
