name: Oleg sites Playwright indexability audit
on:
  push:
    branches: [audit-oleg-sites-playwright-20261115]
    paths:
      - 'audits/oleg-indexing/**'
      - '.github/workflows/oleg-playwright-indexability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: audits/oleg-indexing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Audit public indexing eligibility without changing sites
        run: node audit.cjs
      - name: Attach report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oleg-indexability
          path: audits/oleg-indexing/oleg-indexability.json
          if-no-files-found: warn
