name: Neurofactory PROVIDERS isolated offline regression
on:
  push:
    branches:
      - neurofactory-providers-resilience-20261014
    paths:
      - bridge/neurofactory/providers/**
      - .github/workflows/neurofactory-providers-isolated-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-only-unittests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''
      - name: Compile isolated PROVIDERS
        run: python -m compileall -q bridge/neurofactory/providers
      - name: Offline provider and process-recovery tests
        run: python -m unittest discover -s bridge/neurofactory/providers -p "test_*.py" -v
