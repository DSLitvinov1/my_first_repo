name: Neurofactory REVIEW exact CORE expired lease negative
on:
  push:
    branches:
      - neurofactory-review-owned-20261013
    paths:
      - .github/workflows/neurofactory-review-owned-expired-lease.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one_expired_lease_boundary_negative:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout REVIEW-only code
        uses: actions/checkout@v4
        with:
          ref: neurofactory-review-owned-20261013
          persist-credentials: false
      - name: Save own negative script outside source checkout
        run: cp bridge/neurofactory/development/review_owned/independent_core_expired_lease_20261015.py "$RUNNER_TEMP/review_lease_expiry.py"
      - name: Checkout exact CORE candidate only
        uses: actions/checkout@v4
        with:
          ref: 18becc1ad8c17c9259d0e7f646683d0568ce18d6
          persist-credentials: false
          clean: true
      - name: Pin exact code before own negative
        run: test "$(git rev-parse HEAD)" = "18becc1ad8c17c9259d0e7f646683d0568ce18d6"
      - name: One synthetic expired lease file effect negative
        run: python3 -B "$RUNNER_TEMP/review_lease_expiry.py" "$GITHUB_WORKSPACE/bridge/neurofactory/development/core_owned"
      - name: Confirm source checkout untouched
        run: git diff --exit-code
