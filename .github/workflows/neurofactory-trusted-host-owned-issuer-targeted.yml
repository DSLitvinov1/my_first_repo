name: Neurofactory TRUSTED HOST offline signature chain targeted
on:
  push:
    branches:
      - neurofactory-trusted-host-owned-20261015
    paths:
      - bridge/neurofactory/trusted_host/offline_issuer.py
      - bridge/neurofactory/trusted_host/test_offline_issuer.py
      - .github/workflows/neurofactory-trusted-host-owned-issuer-targeted.yml
permissions:
  contents: read
jobs:
  offline-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install cryptography only to ephemeral test virtual environment
        run: |
          python3 -m venv .nf-issuer-test-venv
          .nf-issuer-test-venv/bin/python -m pip install --disable-pip-version-check 'cryptography==44.0.3'
      - name: Run only new verifier negative cases
        run: .nf-issuer-test-venv/bin/python -B -m unittest discover -s bridge/neurofactory/trusted_host -p 'test_offline_issuer.py' -v
