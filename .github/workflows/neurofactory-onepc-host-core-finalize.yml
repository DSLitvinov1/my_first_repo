name: Neurofactory one-PC signed HOST receipt to CORE SQLite (TEST SIGNER ONLY)
on:
  push:
    branches: [neurofactory-onepc-final-integration-20261018]
    paths:
      - bridge/neurofactory/development/core_owned/one_task_core.py
      - bridge/neurofactory/one_pc_candidate/test_signed_host_core_completion.py
      - .github/workflows/neurofactory-onepc-host-core-finalize.yml
permissions:
  contents: read
jobs:
  persistent-host-core-reconciliation:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin tested integration SHA
        run: git rev-parse HEAD
      - name: Install offline verifier test dependency
        run: python -m pip install --disable-pip-version-check --no-input "cryptography==46.0.3"
      - name: Genuine pinned CORE SQLite + synthetic HOST signer -> safe final checkpoint
        run: python -B -m unittest discover -s bridge/neurofactory/one_pc_candidate -p test_signed_host_core_completion.py -v
      - name: Verify no unexpected tracked changes
        run: git diff --exit-code
