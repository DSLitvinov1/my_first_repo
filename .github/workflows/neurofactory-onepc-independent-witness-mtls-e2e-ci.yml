name: Neurofactory remote witness real TLS1.3 client-server SQLite reservation (disposable CI only)
on:
  push:
    branches: [neurofactory-onepc-physical-trust-boundary-20261027]
    paths:
      - bridge/neurofactory/one_pc_candidate/external_highwater_mtls_server.py
      - bridge/neurofactory/one_pc_candidate/test_external_highwater_mtls_server.py
      - .github/workflows/neurofactory-onepc-independent-witness-mtls-e2e-ci.yml
permissions:
  contents: read
jobs:
  real-mtls-separated-process-boundary-ci-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert disposable unprivileged process and run TLS 1.3 mutual-auth transaction
        run: |
          if [ "$GITHUB_ACTIONS" != "true" ] || [ "$(id -u)" -eq 0 ]; then
            echo 'REAL_WITNESS_MTLS_HOSTED_NONROOT_CI_ONLY'
            exit 1
          fi
          python -m venv "$RUNNER_TEMP/nf_external_mtls"
          "$RUNNER_TEMP/nf_external_mtls/bin/python" -m pip install --disable-pip-version-check --no-input "cryptography==46.0.3"
          "$RUNNER_TEMP/nf_external_mtls/bin/python" -B -m unittest discover -s bridge/neurofactory/one_pc_candidate -p test_external_highwater_mtls_server.py -v
          git diff --exit-code
          echo 'NF_REAL_TLS13_MUTUAL_CERT_PINNED_TO_REMOTE_SQLITE_CAS_AND_SIGNED_ACK=PASS_CI_SIMULATOR_ONLY'
          echo 'NF_INDEPENDENT_PHYSICAL_REMOTE_WITNESS=NOT_CONNECTED'
          echo 'NF_OWNER_CERTIFICATE_AND_HARDWARE_KEYS=NOT_ENROLLED'
          echo 'NF_PRODUCTION_SERVICE_PERMISSION=BLOCKED'

      - name: Package exact no-secret external witness sources for independent review
        run: |
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          root=Path("bridge/neurofactory/one_pc_candidate")
          names=(
            "external_highwater_store.py",
            "external_highwater_mtls_server.py",
            "remote_highwater_client.py",
            "independent_witness_receipt.py",
            "WITNESS_REMOTE_NODE_DEPLOYMENT_BLOCKERS_20261027_RU.md",
          )
          out=Path("neurofactory-external-witness-sources-NO-KEYS.zip")
          hashes=[]
          with zipfile.ZipFile(out,"w",compression=zipfile.ZIP_DEFLATED) as archive:
            for name in names:
              raw=(root/name).read_bytes()
              assert not any(k in raw for k in (b"BEGIN PRIVATE KEY",b"BEGIN RSA PRIVATE KEY"))
              archive.writestr(name,raw)
              hashes.append({"path":name,"sha256":hashlib.sha256(raw).hexdigest(),"bytes":len(raw)})
            manifest={"schema":"nf.external_witness.source_review_manifest.v1",
                      "source_sha40":__import__("os").environ["GITHUB_SHA"],
                      "status":"NO_PRIVATE_KEYS_NOT_ATTESTED_OR_SIGNED",
                      "files":hashes}
            archive.writestr("source-manifest.json",
                             json.dumps(manifest,sort_keys=True,separators=(",",":")))
          with zipfile.ZipFile(out) as archive:
            assert len(archive.namelist())==len(names)+1
            for entry in hashes:
              assert hashlib.sha256(archive.read(entry["path"])).hexdigest()==entry["sha256"]
          print("NF_EXTERNAL_WITNESS_REVIEW_SOURCES_WITH_HASH_MANIFEST=PASS_NO_KEYS")
          print("NF_EXTERNAL_WITNESS_REVIEW_ARCHIVE_SHA256="+hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Neurofactory-External-Witness-REVIEW-SOURCES-NO-KEYS
          path: neurofactory-external-witness-sources-NO-KEYS.zip
          retention-days: 7
          if-no-files-found: error
