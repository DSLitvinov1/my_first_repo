name: Neurofactory real signed witness post-wire clock and no-retry regression
on:
  push:
    branches: [neurofactory-p0-real-two-node-witness-clock-fix-20261105]
    paths:
      - 'bridge/neurofactory/one_pc_candidate/remote_highwater_client.py'
      - 'bridge/neurofactory/one_pc_candidate/independent_witness_receipt.py'
      - 'bridge/neurofactory/one_pc_candidate/test_independent_witness_receipt.py'
      - 'bridge/neurofactory/one_pc_candidate/protected_host_remote_bridge.py'
      - 'bridge/neurofactory/one_pc_candidate/test_remote_highwater_client.py'
      - 'bridge/neurofactory/one_pc_candidate/test_protected_host_remote_bridge.py'
      - '.github/workflows/neurofactory-p0-physical-witness-postwire-clock-regression.yml'
permissions:
  contents: read
jobs:
  signed_remote_ack_validation_linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin test-only crypto dependency
        run: python -m pip install --disable-pip-version-check --no-input 'cryptography==46.0.3'
      - name: Trusted local time AFTER real remote ACK; refuse rollback or future
        run: |
          python -B -m unittest discover -s bridge/neurofactory/one_pc_candidate -p test_independent_witness_receipt.py -v
          python -B -m unittest discover -s bridge/neurofactory/one_pc_candidate -p test_remote_highwater_client.py -v
          python -B -m unittest discover -s bridge/neurofactory/one_pc_candidate -p test_protected_host_remote_bridge.py -v
          git diff --exit-code
      - name: Real TLS1.3 mutual-auth signed witness server regression on temporary Linux
        run: |
          python -B -m unittest discover -s bridge/neurofactory/one_pc_candidate -p test_external_highwater_mtls_server.py -v
  signed_remote_ack_validation_windows:
    runs-on: windows-2025
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin test-only crypto dependency
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input 'cryptography==46.0.3'
          if ($LASTEXITCODE -ne 0) {throw 'WINDOWS_CRYPTO_DEPENDENCY_FAILURE'}
      - name: Windows bounded post-wire local time and signed three-party callback
        shell: pwsh
        run: |
          python -B -m unittest discover -s bridge/neurofactory/one_pc_candidate -p test_independent_witness_receipt.py -v
          python -B -m unittest discover -s bridge/neurofactory/one_pc_candidate -p test_remote_highwater_client.py -v
          if ($LASTEXITCODE -ne 0) {throw 'POSTWIRE_REMOTE_RECEIPT_CLOCK_FAILURE'}
          python -B -m unittest discover -s bridge/neurofactory/one_pc_candidate -p test_protected_host_remote_bridge.py -v
          if ($LASTEXITCODE -ne 0) {throw 'SIGNED_HOST_RECEIPT_CLOCK_FAILURE'}
          git diff --exit-code
