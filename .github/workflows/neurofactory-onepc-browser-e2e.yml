name: Neurofactory one-PC existing Russian UI real browser to SQLite
on:
  push:
    branches: [neurofactory-onepc-final-integration-20261018]
    paths:
      - bridge/neurofactory/control_ui/**
      - bridge/neurofactory/one_pc_candidate/local_workspace.py
      - bridge/neurofactory/one_pc_candidate/test_local_workspace_browser.py
      - .github/workflows/neurofactory-onepc-browser-e2e.yml
permissions:
  contents: read
jobs:
  browser-real-localhost:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create browser-only Python environment
        run: python -m venv "$RUNNER_TEMP/nf_browser"
      - name: Install isolated browser testing
        run: |
          "$RUNNER_TEMP/nf_browser/bin/python" -m pip install --disable-pip-version-check "playwright==1.56.0"
          "$RUNNER_TEMP/nf_browser/bin/python" -m playwright install --with-deps chromium
      - name: Use real Chromium localhost browser with persistent projects and tasks
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: "$RUNNER_TEMP/nf_browser/bin/python" -B bridge/neurofactory/one_pc_candidate/test_local_workspace_browser.py
      - name: Verify unchanged repository
        run: git diff --exit-code
