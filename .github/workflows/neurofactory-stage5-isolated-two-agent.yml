name: Neurofactory Stage5 Isolated Two-Agent Evidence
on:
  push:
    branches: [neurofactory-stage5-isolated-acceptance-20261013]
    paths:
      - '.github/workflows/neurofactory-stage5-isolated-two-agent.yml'
permissions:
  contents: read
concurrency:
  group: neurofactory-stage5-isolated-two-agent
  cancel-in-progress: false
jobs:
  isolated_two_agent_check:
    runs-on: [self-hosted, Windows, X64, chatgpt-bridge]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Sequential real local models and read-only queue validation
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'neurofactory-stage5-isolated'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $models = Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/tags' -TimeoutSec 10
          $names = @($models.models | ForEach-Object { $_.name })
          foreach ($needed in @('qwen2.5-coder:7b','qwen3:4b')) {
            if ($names -notcontains $needed) { throw "Missing local model: $needed. No automatic pull allowed." }
          }
          # The actual immutable writer output is passed to the independent reviewer.
          # A task description alone is never evidence of independent review.
          $writerRequest = @{ model = 'qwen2.5-coder:7b'; prompt = 'Write only a pure Python function sum_even(values) that sums even integers. No external tools.'; stream = $false; options = @{ num_predict = 350; temperature = 0 } } | ConvertTo-Json -Depth 5
          $writer = Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/generate' -Method Post -ContentType 'application/json' -Body $writerRequest -TimeoutSec 240
          if ([string]::IsNullOrWhiteSpace($writer.response) -or $writer.model -notlike 'qwen2.5-coder:7b*') { throw 'Writer unavailable; stop without publication.' }
          $candidate = [string]$writer.response
          $digest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($candidate))).ToLowerInvariant()
          $candidate | Set-Content -Encoding utf8 (Join-Path $dir 'candidate.txt')
          $reviewPrompt = 'You are an independent reviewer. Analyze the following exact candidate for correctness, safety and edge cases. Report explicitly REVIEW_OK only if the candidate is correct, otherwise REVIEW_REJECT. Explain your decision and tests. Candidate SHA256: ' + $digest + "`nCANDIDATE START`n" + $candidate + "`nCANDIDATE END"
          $reviewRequest = @{ model = 'qwen3:4b'; prompt = $reviewPrompt; stream = $false; options = @{ num_predict = 650; temperature = 0 } } | ConvertTo-Json -Depth 5
          $review = Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/generate' -Method Post -ContentType 'application/json' -Body $reviewRequest -TimeoutSec 240
          if ([string]::IsNullOrWhiteSpace($review.response) -or $review.model -notlike 'qwen3:4b*') { throw 'Reviewer unavailable; stop without publication.' }
          $verdict = [string]$review.response
          $accepted = ($verdict -match '(?m)^REVIEW_OK\b') -and ($verdict -notmatch 'REVIEW_REJECT')
          @{ role = 'writer'; model = $writer.model; candidate_sha256 = $digest; completed = $true; published = $false } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $dir 'writer.json')
          @{ role = 'reviewer'; model = $review.model; reviewed_candidate_sha256 = $digest; approved = $accepted; completed = $true; published = $false } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $dir 'reviewer.json')
          if (-not $accepted) { throw 'Independent reviewer did not explicitly approve the candidate. No publication permitted.' }
          $env:PYTHONPATH = 'bridge/neurofactory/development'
          python -B -m unittest discover -s bridge/neurofactory/development -p test_stage5_development_queue.py -v
          python -B -m unittest discover -s bridge/neurofactory/development -p test_stage5_remote_journal.py -v
          python -B -m unittest discover -s bridge/neurofactory/development -p test_stage5_git_receipts.py -v
          python -B -m unittest discover -s bridge/neurofactory/development -p test_stage5_usage_ledger.py -v
          python -B bridge/neurofactory/development/control_plane.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neurofactory-stage5-isolated-model-evidence
          path: |
            ${{ runner.temp }}/neurofactory-stage5-isolated/*.json
            ${{ runner.temp }}/neurofactory-stage5-isolated/candidate.txt
          if-no-files-found: warn
