name: Oleg backup CRM contact UX Playwright preview
on:
  push:
    branches: [audit-oleg-sites-playwright-20261115]
    paths: ['audits/oleg-indexing/oleg-crm-backup-links-v1.js','audits/oleg-indexing/test_oleg_crm_backup_preview.cjs','.github/workflows/oleg-crm-backup-preview.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: audits/oleg-indexing
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate safe CRM fallback on two sites and desktop/mobile
        run: |
          node --check oleg-crm-backup-links-v1.js
          node --check test_oleg_crm_backup_preview.cjs
          node test_oleg_crm_backup_preview.cjs
      - name: Preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oleg-crm-backup-preview
          path: audits/oleg-indexing/oleg-crm-backup-preview.json
          if-no-files-found: warn
