name: Neurofactory recipient durable CORE plus signed witness one-shot fence lab CI
on:
  push:
    branches: [neurofactory-p0-recipient-signed-witness-fence-20261103]
    paths:
      - 'bridge/neurofactory/one_pc_candidate/scm_one_effect_witness_fence.py'
      - 'bridge/neurofactory/one_pc_candidate/test_scm_one_effect_witness_fence.py'
      - 'bridge/neurofactory/one_pc_candidate/scm_recipient_core_claim_guard.py'
      - 'bridge/neurofactory/one_pc_candidate/protected_host_core_witness_binding.py'
      - 'bridge/neurofactory/one_pc_candidate/protected_host_remote_bridge.py'
      - 'bridge/neurofactory/one_pc_candidate/external_highwater_mtls_server.py'
      - '.github/workflows/neurofactory-p0-recipient-signed-witness-fence-ci.yml'
permissions:
  contents: read
jobs:
  signed-three-party-core-witness-no-repeat:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    timeout-minutes: 9
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact CORE, owner, reviewer, witness, rollback and no-retry
        shell: pwsh
        run: |
          python -m venv (Join-Path $env:RUNNER_TEMP 'nf-fence-venv')
          $python=Join-Path $env:RUNNER_TEMP 'nf-fence-venv/Scripts/python.exe'
          if (!(Test-Path $python)) {$python=Join-Path $env:RUNNER_TEMP 'nf-fence-venv/bin/python'}
          & $python -m pip install --disable-pip-version-check --no-input 'cryptography==46.0.3'
          if ($LASTEXITCODE -ne 0) {throw 'VENV_CRYPTO_INSTALL_FAILED'}
          & $python -B -m unittest discover -s bridge/neurofactory/one_pc_candidate -p test_scm_one_effect_witness_fence.py -v
          if ($LASTEXITCODE -ne 0) {throw 'FENCE_TESTS_FAILED'}
      - name: Source untouched
        shell: bash
        run: git diff --exit-code
  actual-tls13-mtls-signed-sqlite-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Real TLS1.3 client/server and Ed25519 SQLite commit (localhost ONLY)
        shell: bash
        run: |
          if [ "$GITHUB_ACTIONS" != "true" ] || [ "$(id -u)" -eq 0 ]; then exit 1; fi
          python -m venv "$RUNNER_TEMP/nf-witness-venv"
          "$RUNNER_TEMP/nf-witness-venv/bin/python" -m pip install --disable-pip-version-check --no-input "cryptography==46.0.3"
          "$RUNNER_TEMP/nf-witness-venv/bin/python" -B -m unittest discover -s bridge/neurofactory/one_pc_candidate -p test_external_highwater_mtls_server.py -v
          git diff --exit-code
          echo "NF_REAL_MTLS_LAB_WITH_EXTERNAL_SQLITE=PASS_IF_TESTS_PASS_NOT_PHYSICAL_ATTESTATION"
