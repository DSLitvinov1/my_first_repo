name: Neurofactory Windows SCM pinned CORE and ACL cross-branch test only
on:
  push:
    branches: [neurofactory-windows-scm-acl-crosscheck-20261018]
    paths:
      - bridge/neurofactory/trusted_host/windows_scm_acl_crosscheck_ci.py
      - bridge/neurofactory/trusted_host/test_windows_scm_two_user_recovery.py
      - .github/workflows/neurofactory-windows-scm-acl-crosscheck-ci.yml
  pull_request:
    branches: [neurofactory-windows-service-separated-sid-20261018]
permissions:
  contents: read
jobs:
  ephemeral-scm-acl-crosscheck:
    runs-on: windows-2025
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        scenario: [normal, crash-window]
    env:
      NF_WINDOWS_SCM_DISPOSABLE_ONLY: "1"
      NF_WINDOWS_CROSS_BRANCH_ACL_VERIFY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: beb08eff32923d8ca364aabfde0458f380acf8e7
          path: .nf_pinned_core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 681375ce0b959812fc836bf4d14abc107b58e9ca
          path: .nf_pinned_acl
          persist-credentials: false
      - name: Confirm exact immutable CORE and ACL source
        shell: pwsh
        run: |
          if ((git -C .nf_pinned_core rev-parse HEAD).Trim() -cne 'beb08eff32923d8ca364aabfde0458f380acf8e7') { throw 'CORE_SHA_MISMATCH' }
          if ((git -C .nf_pinned_core hash-object bridge/neurofactory/development/core_owned/one_task_core.py).Trim() -cne 'ab1471813c6da29407c913b974a2209467a4b961') { throw 'CORE_BLOB_MISMATCH' }
          if ((git -C .nf_pinned_acl rev-parse HEAD).Trim() -cne '681375ce0b959812fc836bf4d14abc107b58e9ca') { throw 'ACL_SHA_MISMATCH' }
          if ((git -C .nf_pinned_acl hash-object bridge/neurofactory/trusted_host/windows_service_sid_acl_audit.py).Trim() -cne 'd135a4f9f763cb4b454bdce4c0121dd91422e76c') { throw 'ACL_BLOB_MISMATCH' }
      - name: Install only disposable CI test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input "pywin32==311" "cryptography==46.0.3"
      - name: Assert live SCM token and reject unauthorized NTFS writer, then test crash/replay
        shell: pwsh
        run: python -B bridge/neurofactory/trusted_host/test_windows_scm_two_user_recovery.py ${{ matrix.scenario }}
      - name: No changes to tracked repository
        shell: pwsh
        run: git diff --exit-code
