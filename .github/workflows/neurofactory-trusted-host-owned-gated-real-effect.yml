name: Neurofactory signer UID to real disposable HOST effect integration
on:
  push:
    branches:
      - neurofactory-trusted-host-owned-20261015
    paths:
      - bridge/neurofactory/trusted_host/offline_operator_gated_receiver.py
      - bridge/neurofactory/trusted_host/offline_signer_scope_guard.py
      - bridge/neurofactory/trusted_host/offline_operator_ipc.py
      - bridge/neurofactory/trusted_host/test_offline_operator_gated_e2e.py
      - .github/workflows/neurofactory-trusted-host-owned-gated-real-effect.yml
permissions:
  contents: read
jobs:
  two-os-principals-single-runner-fixture-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nf_test
          POSTGRES_PASSWORD: nf_test_ephemeral_only
          POSTGRES_DB: nf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nf_test -d nf_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      NF_OPERATOR_ANCHOR_FIXTURE_ONLY: "1"
      NF_HOST_RECEIVER_FIXTURE_ONLY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create disposable separate signer and database identities
        run: |
          sudo groupadd --system nf_operator_ipc
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin nf_signer
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin nf_db_actor
          sudo usermod -aG nf_operator_ipc nf_signer
          sudo usermod -aG nf_operator_ipc nf_db_actor
          test "$(id -u nf_signer)" != "$(id -u nf_db_actor)"
      - name: Install test-only Python on ephemeral authorized GH Linux
        run: |
          python3 -m venv /tmp/nf-operator-e2e-venv
          /tmp/nf-operator-e2e-venv/bin/python -m pip install --no-input --disable-pip-version-check "psycopg[binary]==3.2.6" cryptography==46.0.3
          mkdir -p /tmp/nf-ipc-source
          cp bridge/neurofactory/trusted_host/offline_operator_anchor.py /tmp/nf-ipc-source/
          cp bridge/neurofactory/trusted_host/offline_operator_ipc.py /tmp/nf-ipc-source/
          cp bridge/neurofactory/trusted_host/signed_effect_permit.py /tmp/nf-ipc-source/
          cp bridge/neurofactory/trusted_host/offline_signer_scope_guard.py /tmp/nf-ipc-source/
          cp bridge/neurofactory/trusted_host/offline_fenced_file_receiver.py /tmp/nf-ipc-source/
          cp bridge/neurofactory/trusted_host/offline_operator_gated_receiver.py /tmp/nf-ipc-source/
          cp bridge/neurofactory/trusted_host/offline_cas.py /tmp/nf-ipc-source/
          cp bridge/neurofactory/trusted_host/offline_effect_reservation.py /tmp/nf-ipc-source/
      - name: One actual temporary file effect only after exact signer scope, live PG CAS, replay protection
        run: |
          git rev-parse HEAD
          NF_OPERATOR_IPC_STAGED_SOURCE=/tmp/nf-ipc-source/offline_operator_ipc.py NF_OPERATOR_TEST_PYTHON=/tmp/nf-operator-e2e-venv/bin/python /tmp/nf-operator-e2e-venv/bin/python -B -m unittest discover -s bridge/neurofactory/trusted_host -p 'test_offline_operator_gated_e2e.py' -v
