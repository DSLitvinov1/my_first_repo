name: Oleg assistant 40-page offline-only stage and guarded unit tests
on:
  push:
    branches: [audit-oleg-sites-playwright-20261115]
    paths:
      - 'audits/oleg-indexing/assistant_sitewide_stage.py'
      - 'audits/oleg-indexing/test_assistant_sitewide_stage.py'
      - 'audits/oleg-indexing/ASSISTANT_COVERAGE_SOURCE_LOCK_20261116.json'
      - '.github/workflows/oleg-assistant-offline-stage.yml'
permissions:
  contents: read
jobs:
  verified-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: audits/oleg-indexing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify strict injection behavior and URL guards
        run: python -m unittest -v test_assistant_sitewide_stage
      - name: Download public HTML, enforce exact SHA lock and stage only
        run: python assistant_sitewide_stage.py --lock ASSISTANT_COVERAGE_SOURCE_LOCK_20261116.json --out assistant-stage-output
      - name: Inspect stage result with no production writes
        run: |
          python - <<'PY'
          import json,pathlib,zipfile
          p=pathlib.Path('assistant-stage-output/stage-report.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['status']=='OFFLINE_ONLY_40_PAGE_ASSISTANT_STAGE_PASS'
          assert d['pages_total']==41 and d['pages_changed']==40
          assert d['sites']=={'potrebpravo.ru':22,'semya-yurist.ru':17}
          assert d['offline_backup_verified'] and not d['production_modified']
          with zipfile.ZipFile(d['archive']) as z:
              assert z.testzip() is None and len(z.namelist())==41
          print('STAGED_40_ASSISTANT_PAGES_AND_41_PUBLIC_HTML_BACKUPS_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: oleg-assistant-offline-stage-40
          path: |
            audits/oleg-indexing/assistant-stage-output/potrebpravo.ru
            audits/oleg-indexing/assistant-stage-output/semya-yurist.ru
            audits/oleg-indexing/assistant-stage-output/original-public-html-backup.zip
            audits/oleg-indexing/assistant-stage-output/stage-report.json
          if-no-files-found: error
