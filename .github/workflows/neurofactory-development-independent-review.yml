name: Neurofactory Independent Real Development Review
on:
  push:
    branches: [neurofactory-public-lab-20261012]
    paths:
      - 'bridge/neurofactory/development/review-request.json'
permissions:
  contents: write
concurrency:
  group: neurofactory-verified-development-review
  cancel-in-progress: false
jobs:
  independent_second_agent:
    if: ${{ github.repository == 'DSLitvinov1/my_first_repo' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - name: Checkout exact isolated neurofactory source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run actual control-plane tests before AI verdict
        run: |
          python -B -m unittest discover -s bridge/neurofactory/development -p test_control_plane.py -v
          python -B bridge/neurofactory/development/control_plane.py --check
      - name: Start free independent local reviewer Qwen3
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > "$RUNNER_TEMP/neurofactory-review.log" 2>&1 &)
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags > /dev/null
          ollama pull qwen3:4b
      - name: Independently review real Neurofactory control code (no publishing credential)
        env:
          NF_FREE_PUBLIC_CONFIRMED: "yes"
        run: python -B bridge/neurofactory/development/independent_review.py
      - name: Publish independent verdict with source checksum; do not read private Windows repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.error,urllib.request
          root=pathlib.Path('bridge/neurofactory/development')
          proof=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'neurofactory-review.json').read_text('utf-8'))
          assert proof['verdict']=='REVIEW_OK' and proof['stage']=='NF-DEV-01'
          assert proof['source_sha256']==hashlib.sha256((root/'control_plane.py').read_bytes()).hexdigest()
          assert proof['roadmap_sha256']==hashlib.sha256((root/'roadmap.json').read_bytes()).hexdigest()
          token=os.environ['GITHUB_TOKEN']
          repo='DSLitvinov1/my_first_repo'
          api='https://api.github.com/repos/'+repo+'/contents/'
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
                   'Content-Type':'application/json','User-Agent':'NeurofactoryIndependentReviewGate'}
          source_req=urllib.request.Request(api+'bridge/neurofactory/development/control_plane.py?ref=neurofactory-public-lab-20261012',headers=headers)
          with urllib.request.urlopen(source_req,timeout=25) as response: src=json.load(response)
          remote_source=base64.b64decode(src['content'])
          assert hashlib.sha256(remote_source).hexdigest()==proof['source_sha256'], 'Reviewer source changed'
          proof.update({'review_run_id':int(os.environ['GITHUB_RUN_ID']),
                        'reviewed_commit':os.environ['GITHUB_SHA'],
                        'cloud_tests_passed':24,
                        'windows_bridge_run':38318013640,
                        'private_windows_status':'must_be_checked_via_authorized_connector_before_roadmap_advancement',
                        'milestone_automatically_completed':False})
          data=json.dumps(proof,ensure_ascii=False,indent=2).encode('utf-8')
          path='bridge/neurofactory/development/independent-review-nf-dev-01.json'
          url=api+path
          sha=None
          try:
              with urllib.request.urlopen(urllib.request.Request(url+'?ref=neurofactory-public-lab-20261012',headers=headers),timeout=20) as response:
                  existing=json.load(response);sha=existing['sha']
          except urllib.error.HTTPError as exc:
              if exc.code!=404:raise
          payload={'branch':'neurofactory-public-lab-20261012',
                   'message':'neurofactory: independently reviewed actual development code',
                   'content':base64.b64encode(data).decode('ascii')}
          if sha:payload['sha']=sha
          request=urllib.request.Request(url,method='PUT',data=json.dumps(payload).encode(),headers=headers)
          with urllib.request.urlopen(request,timeout=30) as response: receipt=json.load(response)
          print('INDEPENDENT_REVIEW_PERSISTED',proof['review_run_id'],receipt['commit']['sha'])
          PY
