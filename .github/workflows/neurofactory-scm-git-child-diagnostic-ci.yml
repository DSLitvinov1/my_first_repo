name: Neurofactory SCM restricted Git child DLL startup diagnostic 20261021
on:
  push:
    branches: [neurofactory-scm-git-child-diagnostics-20261021]
    paths:
      - bridge/neurofactory/one_pc_candidate/windows_scm_core_admission_ci.py
      - bridge/neurofactory/one_pc_candidate/test_windows_scm_core_admission_ci.py
      - .github/workflows/neurofactory-scm-git-child-diagnostic-ci.yml
permissions:
  contents: read
jobs:
  scm-git-exact-repro:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      NF_OWNER_SIGNER_DISPOSABLE_CI: "1"
      NF_CORE_ADMISSION_PIPE_CI_ONLY: "1"
      NF_SCM_CORE_TRIPLE_SID_CI: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Disposable Windows and precise source syntax
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'NO_LOCAL_OWNER_SCALING' }
          python -B -m py_compile bridge/neurofactory/one_pc_candidate/windows_scm_core_admission_ci.py
          if ($LASTEXITCODE -ne 0) {throw 'INVALID_SCM_CANDIDATE_SYNTAX'}
      - name: Restore isolated CI-only pywin32 and Ed25519
        run: |
          python -m pip install --disable-pip-version-check --no-input "pywin32==311" "cryptography==46.0.3"
          if ($LASTEXITCODE -ne 0) {throw 'WINDOWS_TEST_DEPENDENCIES_UNAVAILABLE'}
      - name: Single selected restricted Windows SCM Git subprocess E2E
        run: |
          Push-Location bridge/neurofactory/one_pc_candidate
          try {
            python -B -m unittest test_windows_scm_core_admission_ci.ThreeRealWindowsPrincipals.test_actual_three_windows_identities_one_signed_core_enqueue -v
            if ($LASTEXITCODE -ne 0) { Write-Host 'SCM_CORE_TRIPLE_SID_NOT_YET_ACCEPTED' }
          } finally { Pop-Location }
          $d='C:\ProgramData\NFCoreAdmissionSCMCI\core\scm-git-child-diagnostic.json'
          if (Test-Path $d) {Get-Content $d -Raw}
          else {Write-Host 'NO_SCM_GIT_DIAGNOSTIC_CAPTURED'}
          Write-Host 'The diagnostic never counts as a passing signed CORE admission test.'
      - name: No signed model code or owner computer changed
        run: git diff --exit-code
