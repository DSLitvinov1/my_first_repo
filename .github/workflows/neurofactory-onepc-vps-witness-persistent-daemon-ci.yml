name: Neurofactory independent VPS witness long-lived mTLS service and strict operator guard (hosted CI)
on:
  push:
    branches: [neurofactory-independent-vps-witness-operator-20261027]
    paths:
      - bridge/neurofactory/one_pc_candidate/external_highwater_daemon.py
      - bridge/neurofactory/one_pc_candidate/test_external_highwater_daemon.py
      - bridge/neurofactory/one_pc_candidate/vps_witness_systemd/**
      - .github/workflows/neurofactory-onepc-vps-witness-persistent-daemon-ci.yml
permissions:
  contents: read
jobs:
  real-repeated-tls1p3-witness-reservations-replay-denied:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run only hosted Linux unprivileged trust boundary
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" -ne 0
          python -m venv "$RUNNER_TEMP/nf-persistent-remote-witness"
          "$RUNNER_TEMP/nf-persistent-remote-witness/bin/python" -m pip install --disable-pip-version-check --no-input "cryptography==46.0.3"
          "$RUNNER_TEMP/nf-persistent-remote-witness/bin/python" -B -m unittest discover -s bridge/neurofactory/one_pc_candidate -p test_external_highwater_daemon.py -v
          "$RUNNER_TEMP/nf-persistent-remote-witness/bin/python" -B -m unittest discover -s bridge/neurofactory/one_pc_candidate -p test_verify_witness_source_archive.py -v
          if "$RUNNER_TEMP/nf-persistent-remote-witness/bin/python" -B bridge/neurofactory/one_pc_candidate/external_highwater_daemon.py --audit; then
            echo 'UNPROVISIONED_REMOTE_WITNESS_MUST_FAIL_CLOSED'
            exit 1
          fi
          git diff --exit-code
          echo 'NF_PERSISTENT_VPS_PRIVATE_VPN_MTLS_MULTI_REQUEST_REPLAY=PASS_CI_ONLY'
          echo 'NF_REAL_EXTERNAL_VPS_ACTUALLY_PROVISIONED=FALSE'
          echo 'NF_PRODUCTION_EXTERNAL_OWNER_KEYS_INSTALLED=FALSE'
      - name: Bundle operator-review VPS daemon source and exact SHA manifest WITHOUT SECRET KEYS
        run: |
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          root=Path("bridge/neurofactory/one_pc_candidate")
          names=(
            "external_highwater_daemon.py",
            "external_highwater_store.py",
            "external_highwater_mtls_server.py",
            "independent_witness_receipt.py",
            "remote_highwater_client.py",
            "vps_witness_systemd/neurofactory-witness.service",
            "vps_witness_systemd/production.json.example",
            "vps_witness_systemd/requirements-witness.txt",
            "vps_witness_systemd/OPERATOR_VPS_INSTALLATION_RU.md",
            "vps_witness_systemd/verify_witness_source_archive.py",
            "WITNESS_REMOTE_NODE_DEPLOYMENT_BLOCKERS_20261027_RU.md",
          )
          dest=Path("Neurofactory-VPS-Witness-OPERATOR-STAGING-NO-KEYS.zip")
          manifest={"schema":"nf.vps_witness.source_review_bundle.v1",
                    "source_sha40":os.environ["GITHUB_SHA"],
                    "mode":"UNSIGNED_OPERATOR_REVIEW_NO_KEYS_NO_PRODUCTION",
                    "files":[]}
          with zipfile.ZipFile(dest,"w",zipfile.ZIP_DEFLATED) as z:
            for name in names:
              data=(root/name).read_bytes()
              assert not any(marker in data for marker in (
                b"-----BEGIN PRIVATE KEY-----",
                b"-----BEGIN RSA PRIVATE KEY-----",
                b"-----BEGIN OPENSSH PRIVATE KEY-----",
              )),name
              z.writestr(name,data)
              manifest["files"].append({
                "path":name,"sha256":hashlib.sha256(data).hexdigest(),"bytes":len(data)})
            z.writestr("source-manifest.json",
                       json.dumps(manifest,sort_keys=True,ensure_ascii=True))
          with zipfile.ZipFile(dest) as z:
            assert len(z.namelist())==len(names)+1
            for item in manifest["files"]:
              assert hashlib.sha256(z.read(item["path"])).hexdigest()==item["sha256"]
            invalid=json.loads(z.read("vps_witness_systemd/production.json.example"))
            assert invalid["listen_address"]=="SET_OPERATOR_PRIVATE_VPN_IPV4"
          from sys import path as pythonpath
          pythonpath.insert(0,str(root))
          from vps_witness_systemd.verify_witness_source_archive import verify_archive
          result=verify_archive(path=dest.resolve(),
            operator_approved_archive_sha256=hashlib.sha256(dest.read_bytes()).hexdigest())
          assert not result["may_install_or_activate"]
          assert result["verified_files"]==len(names)
          print("NF_VPS_WITNESS_OPERATOR_SOURCE_FILES_SHA_VERIFIED="+str(len(names)))
          print("NF_VPS_WITNESS_NO_REAL_KEY_ENROLLMENT_OR_PAYMENT=TRUE")
          print("NF_VPS_WITNESS_SOURCE_BUNDLE_SHA256="+hashlib.sha256(dest.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Neurofactory-VPS-Witness-OPERATOR-STAGING-NO-KEYS
          path: Neurofactory-VPS-Witness-OPERATOR-STAGING-NO-KEYS.zip
          retention-days: 7
          if-no-files-found: error
