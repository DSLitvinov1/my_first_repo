name: Neurofactory personal owner-approved Qwen draft immutable binding
on:
  push:
    branches: [neurofactory-p0-personal-windows-host-remote-highwater-20261105]
    paths:
      - 'bridge/neurofactory/one_pc_candidate/personal_approve_workspace_draft.py'
      - 'bridge/neurofactory/one_pc_candidate/personal_approve_safe_note.py'
      - 'bridge/neurofactory/one_pc_candidate/test_personal_approve_workspace_draft.py'
      - '.github/workflows/neurofactory-personal-owner-approval-smoke.yml'
permissions:
  contents: read
jobs:
  owner_driven_only:
    runs-on: windows-2025
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: One pinned crypto dependency
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input 'cryptography==46.0.3'
          if ($LASTEXITCODE -ne 0) {throw 'CRYPTO_WHEEL_INSTALL_FAILED'}
      - name: One exact-model draft and explicit-human approval boundary
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE='1'
          $env:PYTHONPATH="$env:GITHUB_WORKSPACE\bridge\neurofactory\one_pc_candidate"
          python -B -m unittest discover -s bridge/neurofactory/one_pc_candidate -p test_personal_approve_workspace_draft.py -v
          if ($LASTEXITCODE -ne 0) {throw 'UNTRUSTED_QWEN_OWNER_APPROVAL_BOUNDARY_FAILED'}
          git diff --exit-code
