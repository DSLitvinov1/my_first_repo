name: Neurofactory Windows CORE Named Pipe external witness E2E (NO LIVE)
on:
  push:
    branches: [neurofactory-windows-external-witness-pilot-20261018]
    paths:
      - 'bridge/neurofactory/trusted_host/windows_external_witness_pilot.py'
      - 'bridge/neurofactory/trusted_host/windows_named_pipe_pilot_receiver.py'
      - 'bridge/neurofactory/trusted_host/test_windows_witness_named_pipe_e2e.py'
      - 'bridge/neurofactory/trusted_host/test_windows_external_witness_pilot.py'
      - '.github/workflows/neurofactory-windows-receiver-remote-witness-e2e.yml'
permissions:
  contents: read
jobs:
  core_pipe_witness_single_runner_only:
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      NF_WINDOWS_WITNESS_TEST_ONLY: '1'
      NF_WINDOWS_WITNESS_REQUIRED_TEST_ONLY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: beb08eff32923d8ca364aabfde0458f380acf8e7
          path: .nf_pinned_core
          persist-credentials: false
      - name: Pin original real CORE SQLite source exactly
        shell: pwsh
        run: |
          if ((git -C .nf_pinned_core rev-parse HEAD).Trim() -cne 'beb08eff32923d8ca364aabfde0458f380acf8e7') { throw 'CORE SHA mismatch' }
          if ((git -C .nf_pinned_core hash-object bridge/neurofactory/development/core_owned/one_task_core.py).Trim() -cne 'ab1471813c6da29407c913b974a2209467a4b961') { throw 'CORE source blob mismatch' }
      - name: Install ephemeral crypto and Win32 Named Pipe library
        shell: pwsh
        run: |
          python -m pip install --no-input --disable-pip-version-check 'cryptography==46.0.3' 'pywin32==311'
      - name: Separate witness process durable reservation and restart tests
        shell: pwsh
        run: |
          python -B -m unittest discover -s bridge/neurofactory/trusted_host -p test_windows_external_witness_pilot.py -v
      - name: Actual CORE SQLite via Named Pipe + mTLS witness before inert file
        shell: pwsh
        run: |
          python -B -m unittest discover -s bridge/neurofactory/trusted_host -p test_windows_witness_named_pipe_e2e.py -v
      - name: Confirm tracked project unchanged by tests
        shell: pwsh
        run: git diff --exit-code
