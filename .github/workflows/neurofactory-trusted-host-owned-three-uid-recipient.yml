name: Neurofactory isolated OS file receiver three distinct UID trial
on:
  push:
    branches:
      - neurofactory-trusted-host-owned-20261015
    paths:
      - bridge/neurofactory/trusted_host/offline_os_separated_effect_receiver.py
      - bridge/neurofactory/trusted_host/offline_recipient_protected_journal.py
      - bridge/neurofactory/trusted_host/offline_operator_gated_receiver.py
      - bridge/neurofactory/trusted_host/test_offline_os_separated_effect_receiver.py
      - .github/workflows/neurofactory-trusted-host-owned-three-uid-recipient.yml
permissions:
  contents: read
jobs:
  signer-worker-final-file-receiver-test-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nf_test
          POSTGRES_PASSWORD: nf_test_ephemeral_only
          POSTGRES_DB: nf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nf_test -d nf_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      NF_OPERATOR_ANCHOR_FIXTURE_ONLY: "1"
      NF_HOST_RECEIVER_FIXTURE_ONLY: "1"
      NF_RECEIVER_OS_FIXTURE_ONLY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: DSLitvinov1/my_first_repo
          ref: 2205354c39103612183cf4cc44f61e6f204137a0
          path: .nf_core_pinned
          persist-credentials: false
      - name: Confirm independent CORE source pinned exact SHA
        run: |
          test "$(git -C .nf_core_pinned rev-parse HEAD)" = "2205354c39103612183cf4cc44f61e6f204137a0"
      - name: Create three actual disposable separate Linux OS identities
        run: |
          sudo groupadd --system nf_operator_ipc
          sudo groupadd --system nf_recipient_ipc
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin nf_signer
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin nf_db_actor
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin nf_effect
          sudo usermod -aG nf_operator_ipc nf_signer
          sudo usermod -aG nf_operator_ipc nf_effect
          sudo usermod -aG nf_recipient_ipc nf_db_actor
          sudo usermod -aG nf_recipient_ipc nf_effect
          test "$(id -u nf_signer)" != "$(id -u nf_effect)"
          test "$(id -u nf_effect)" != "$(id -u nf_db_actor)"
          test "$(id -u nf_signer)" != "$(id -u nf_db_actor)"
      - name: Install isolated runtime and copy only code not any key material
        run: |
          python3 -m venv /tmp/nf-os-recipient-venv
          /tmp/nf-os-recipient-venv/bin/python -m pip install --no-input --disable-pip-version-check "psycopg[binary]==3.2.6" cryptography==46.0.3
          mkdir -p /tmp/nf-ipc-source
          for name in offline_operator_anchor.py offline_owner_grant_admission.py offline_operator_ipc.py offline_signer_scope_guard.py signed_effect_permit.py offline_fenced_file_receiver.py offline_operator_gated_receiver.py offline_os_separated_effect_receiver.py offline_recipient_protected_journal.py offline_cas.py offline_effect_reservation.py; do
            cp "bridge/neurofactory/trusted_host/$name" /tmp/nf-ipc-source/
          done
          cp .nf_core_pinned/bridge/neurofactory/development/core_owned/one_task_core.py /tmp/nf-ipc-source/
          cp .nf_core_pinned/bridge/neurofactory/development/core_owned/offline_os_receiver_client.py /tmp/nf-ipc-source/
      - name: Verify isolated recipient alone can write approved scratch file and cannot replay it
        run: |
          git rev-parse HEAD
          NF_OPERATOR_IPC_STAGED_SOURCE=/tmp/nf-ipc-source/offline_operator_ipc.py NF_OPERATOR_TEST_PYTHON=/tmp/nf-os-recipient-venv/bin/python /tmp/nf-os-recipient-venv/bin/python -B -m unittest discover -s bridge/neurofactory/trusted_host -p 'test_offline_os_separated_effect_receiver.py' -k owner_grant_ -v
