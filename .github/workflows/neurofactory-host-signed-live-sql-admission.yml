name: Neurofactory HOST signed four-role current SQL effect admission
on:
  push:
    branches: [neurofactory-host-independent-production-scope-20261018]
    paths:
      - bridge/neurofactory/trusted_host/db_bound_four_party_preflight.py
      - bridge/neurofactory/trusted_host/test_db_bound_four_party_preflight.py
      - .github/workflows/neurofactory-host-signed-live-sql-admission.yml
permissions:
  contents: read
jobs:
  combined-crypto-and-central-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nf_schema_ci
          POSTGRES_PASSWORD: nf_schema_ephemeral_password
          POSTGRES_DB: nf_schema_verify
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nf_schema_ci -d nf_schema_verify"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 12
    env:
      NF_DB_SCHEMA_CI_ONLY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install isolated CI-only libraries
        run: |
          python3 -m venv .nf-signed-sql-venv
          .nf-signed-sql-venv/bin/python -m pip install --no-input --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==46.0.3'
      - name: Test four signed roles AND the exact current PostgreSQL lease
        run: |
          .nf-signed-sql-venv/bin/python -B -m unittest discover -s bridge/neurofactory/trusted_host -p 'test_db_bound_four_party_preflight.py' -v
      - name: Verify no tracked source mutated
        run: git diff --exit-code
