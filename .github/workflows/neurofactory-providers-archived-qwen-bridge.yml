name: Neurofactory providers historic real Qwen response to untrusted proposal
on:
  push:
    branches:
      - neurofactory-providers-ollama-worker-20261015
    paths:
      - bridge/neurofactory/providers/archived_qwen_proposal_bridge.py
      - bridge/neurofactory/providers/test_archived_qwen_proposal_bridge.py
      - .github/workflows/neurofactory-providers-archived-qwen-bridge.yml
permissions:
  contents: read
jobs:
  no-new-inference-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record candidate code exact SHA
        run: git rev-parse HEAD
      - name: Verify observed Qwen response SHA and no-write provider result.v1 projection
        run: python3 -B -m unittest discover -s bridge/neurofactory/providers -p 'test_archived_qwen_proposal_bridge.py' -v
