name: Neurofactory Work local sandbox regression
on:
  push:
    branches: [neurofactory-workbench-personal-mvp-20261107]
    paths:
      - 'bridge/neurofactory/one_pc_candidate/workbench/**'
      - '.github/workflows/neurofactory-workbench-local.yml'
permissions:
  contents: read
jobs:
  isolated_windows_workbench:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run isolated Work regression without secrets or live Qwen
        shell: pwsh
        run: |
          python -B bridge/neurofactory/one_pc_candidate/workbench/test_workbench.py
      - name: Compile Python and validate browser JavaScript syntax
        shell: pwsh
        run: |
          python -m py_compile bridge/neurofactory/one_pc_candidate/workbench/work_core.py bridge/neurofactory/one_pc_candidate/workbench/work_server.py
          node --check bridge/neurofactory/one_pc_candidate/workbench/app.js
