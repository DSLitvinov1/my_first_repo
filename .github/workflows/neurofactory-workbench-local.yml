name: Neurofactory Work local sandbox regression
on:
  push:
    branches: [neurofactory-workbench-personal-mvp-20261107, neurofactory-work-one-agent-safe-20261113, neurofactory-work-one-browser-mouse-20261113, neurofactory-work-one-keyboard-20261113]
    paths:
      - 'bridge/neurofactory/one_pc_candidate/workbench/**'
      - '.github/workflows/neurofactory-workbench-local.yml'
permissions:
  contents: read
jobs:
  isolated_windows_workbench:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run isolated Work regression without secrets or live Qwen
        shell: pwsh
        run: |
          cd bridge/neurofactory/one_pc_candidate/workbench
          python -B -m unittest -v test_workbench test_agent_one test_browser_control
      - name: Compile Python and validate browser JavaScript syntax
        shell: pwsh
        run: |
          python -m py_compile bridge/neurofactory/one_pc_candidate/workbench/work_core.py bridge/neurofactory/one_pc_candidate/workbench/work_server.py bridge/neurofactory/one_pc_candidate/workbench/agent_one.py bridge/neurofactory/one_pc_candidate/workbench/browser_control.py
          node --check bridge/neurofactory/one_pc_candidate/workbench/app.js
          node --check bridge/neurofactory/one_pc_candidate/workbench/browser_worker.cjs
          node --check bridge/neurofactory/one_pc_candidate/workbench/browser_typing.cjs
          node --test bridge/neurofactory/one_pc_candidate/workbench/test_browser_typing.cjs
