name: Neurofactory real restricted Windows SCM requires external signed witness before fixed effect (CI ONLY)
on:
  push:
    branches: [neurofactory-p0-scm-external-witness-admission-20261105]
    paths:
      - 'bridge/neurofactory/trusted_host/windows_named_pipe_pilot_receiver.py'
      - 'bridge/neurofactory/trusted_host/windows_scm_sandbox_receiver.py'
      - 'bridge/neurofactory/trusted_host/test_windows_scm_two_user_recovery.py'
      - 'bridge/neurofactory/one_pc_candidate/scm_witness_service_policy.py'
      - 'bridge/neurofactory/one_pc_candidate/test_scm_signed_witness_service_admission.py'
      - 'bridge/neurofactory/one_pc_candidate/test_scm_signed_witness_policy_binding_ci.py'
      - '.github/workflows/neurofactory-p0-scm-signed-witness-service-admission-ci.yml'
permissions:
  contents: read
jobs:
  windows_actual_scm_requires_signed_remote_operator_gate:
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      NF_WINDOWS_SCM_DISPOSABLE_ONLY: '1'
      NF_WINDOWS_CROSS_BRANCH_ACL_VERIFY: '1'
      NF_WINDOWS_REQUIRE_RESTRICTED_SERVICE_SID: '1'
      NF_ONEPC_FINAL_SIGNED_CI: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f4c424a5544749668fd2eb5657207e7873a6039a
          path: .nf_pinned_core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 681375ce0b959812fc836bf4d14abc107b58e9ca
          path: .nf_pinned_acl
          persist-credentials: false
      - name: Reject real owner PC / wrong immutable CORE
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') {throw 'NO_OWNER_PC_SERVICE_CHANGES'}
          if ((git -C .nf_pinned_core rev-parse HEAD).Trim() -cne 'f4c424a5544749668fd2eb5657207e7873a6039a') { throw 'LATEST_CURRENT_CORE_PIN_MISMATCH' }
      - name: Test libraries only on the disposable hosted Windows runner
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input 'cryptography==46.0.3' 'pywin32==311'
          if ($LASTEXITCODE -ne 0) {throw 'ISOLATED_TEST_DEPS_MISSING'}
      - name: Negative unit tests for no policy, malicious policy or missing callbacks
        shell: pwsh
        run: |
          python -B -m unittest discover -s bridge/neurofactory/one_pc_candidate -p test_scm_signed_witness_service_admission.py -v
          if ($LASTEXITCODE -ne 0) {throw 'SCM_WITNESS_POLICY_NEGATIVE_FAILED'}
      - name: Sealed signed witness permit binds real CORE to one-use receiver fence
        shell: pwsh
        run: |
          python -B -m unittest discover -s bridge/neurofactory/one_pc_candidate -p test_scm_signed_witness_policy_binding_ci.py -v
          if ($LASTEXITCODE -ne 0) {throw 'SEALED_SCM_REAL_CORE_WITNESS_BINDING_FAILED'}
      - name: Real Windows SCM MUST stop without sealed external witness policy
        shell: pwsh
        run: |
          python -B bridge/neurofactory/trusted_host/test_windows_scm_two_user_recovery.py remote-required-missing
          if ($LASTEXITCODE -ne 0) {throw 'REAL_WINDOWS_SERVICE_REMOTE_POLICY_DOWNGRADE'}
      - name: Regression real SCM restricted SID, owner signature, CORE and one harmless file
        shell: pwsh
        run: |
          python -B bridge/neurofactory/trusted_host/test_windows_scm_two_user_recovery.py normal
          if ($LASTEXITCODE -ne 0) {throw 'LEGACY_REAL_SCM_REGRESSION'}
      - name: Repository source unmodified
        shell: pwsh
        run: git diff --exit-code
