name: Neurofactory CORE via pinned HOST receiver offline
on:
  push:
    branches:
      - neurofactory-core-queue-owned-20261013
    paths:
      - bridge/neurofactory/development/core_owned/offline_receiver_client.py
      - bridge/neurofactory/development/core_owned/test_offline_receiver_client.py
      - .github/workflows/neurofactory-core-owned-pinned-receiver.yml
permissions:
  contents: read
jobs:
  core-host-disposable-one-effect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nf_test
          POSTGRES_PASSWORD: nf_test_ephemeral_only
          POSTGRES_DB: nf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nf_test -d nf_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      NF_HOST_RECEIVER_FIXTURE_ONLY: "1"
      NF_CORE_OFFLINE_RECEIVER_TEST_ONLY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin tested HOST source checkout
        uses: actions/checkout@v4
        with:
          ref: 0c33d8181e102e2ca3f47559ae6abeb2f4b72757
          path: .nf_pinned_host
          persist-credentials: false
      - name: Install test-only isolated dependencies
        run: |
          python3 -m venv .nf-core-host-venv
          .nf-core-host-venv/bin/python -m pip install --no-input --disable-pip-version-check "psycopg[binary]==3.2.6" cryptography==46.0.3
      - name: Display exact source SHAs
        run: |
          git rev-parse HEAD
          git -C .nf_pinned_host rev-parse HEAD
      - name: Execute 9 scoped CORE to signed HOST receiver integration tests
        run: .nf-core-host-venv/bin/python -B -m unittest discover -s bridge/neurofactory/development/core_owned -p 'test_offline_receiver_client.py' -v
