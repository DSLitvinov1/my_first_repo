name: Neurofactory Windows protected public key directory — isolated ACL boundary
on:
  push:
    branches: [neurofactory-onepc-production-trust-gates-20261022]
    paths:
      - bridge/neurofactory/one_pc_candidate/windows_setup/audit_windows_operator_public_pins.ps1
      - .github/workflows/neurofactory-onepc-windows-public-pins-acl-ci.yml
permissions:
  contents: read
jobs:
  test-protected-public-root-no-keys-enrolled:
    runs-on: windows-2025
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deny missing trust root and foreign writer on hosted disposable Windows
        run: |
          $ErrorActionPreference='Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') {throw 'NOT_DISPOSABLE_WINDOWS'}
          $base=[Environment]::GetFolderPath('CommonApplicationData')
          $root=Join-Path $base 'Neurofactory'
          $trust=Join-Path $root 'trust'
          $file=Join-Path $trust 'four-party-public-pins.json'
          $script='bridge/neurofactory/one_pc_candidate/windows_setup/audit_windows_operator_public_pins.ps1'
          if (Test-Path -LiteralPath $root) {throw 'NEVER_CHANGE_PREEXISTING_TRUST_ROOT'}
          & pwsh -NoProfile -NonInteractive -File $script *> $null
          if ($LASTEXITCODE -eq 0) {throw 'ABSENT_REAL_OPERATOR_TRUST_ROOT_ACCEPTED'}
          $created=$false
          try {
            New-Item -ItemType Directory -Force $trust | Out-Null
            $created=$true
            # Synthetic PUBLIC metadata ONLY: four distinct random 32-byte
            # placeholders for syntactic verification, never real keys.
            $keys=@{}
            foreach($role in @('operator','owner','host','witness')) {
              $keys[$role]=[Security.Cryptography.RandomNumberGenerator]::GetBytes(32)
            }
            $opHash=[Convert]::ToHexString(
              [Security.Cryptography.SHA256]::HashData($keys['operator'])).ToLowerInvariant()
            $now=[DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
            $fixture=[ordered]@{
              schema='neurofactory.operator.public_pins.v1'
              repository='DSLitvinov1/my_first_repo'
              github_user_id='151650108'
              repository_id='723328237'
              key_valid_from_unix=$now-60
              key_valid_until_unix=$now+1200
              operator_public_base64=[Convert]::ToBase64String($keys['operator'])
              owner_public_base64=[Convert]::ToBase64String($keys['owner'])
              host_public_base64=[Convert]::ToBase64String($keys['host'])
              witness_public_base64=[Convert]::ToBase64String($keys['witness'])
              operator_public_sha256=$opHash
              mtls_witness_cert_sha256=('f'*64)
            }
            [IO.File]::WriteAllBytes($file,[Text.Encoding]::ASCII.GetBytes(
              ($fixture|ConvertTo-Json -Compress)))
            foreach($p in @($root,$trust,$file)) {
              & icacls $p /inheritance:r /grant:r '*S-1-5-18:F' '*S-1-5-32-544:F' | Out-Null
              if ($LASTEXITCODE -ne 0) {throw 'CANNOT_SET_EXPLICIT_TEST_ACL'}
            }
            $ok=(& pwsh -NoProfile -NonInteractive -File $script | ConvertFrom-Json)
            if ($ok.result -cne 'PROTECTED_PUBLIC_PIN_FILE_OBSERVED_NOT_ENROLLED' -or
                $ok.production_service_enabled -ne $false -or
                $ok.private_keys_enrolled_by_auditor -ne $false) {
              throw 'ACL_INSPECTOR_GRANTED_UNJUSTIFIED_TRUST'
            }
            Write-Output 'NF_OPERATOR_WINDOWS_FIXED_PUBLIC_TRUST_ACL_READONLY=PASS_CI_SYNTHETIC'
            $validContent=[IO.File]::ReadAllBytes($file)
            [IO.File]::WriteAllBytes($file,[byte[]](97)*300)
            & pwsh -NoProfile -NonInteractive -File $script *> $null
            if ($LASTEXITCODE -eq 0) {throw 'INVALID_KEY_CONTENT_ELEVATED_TO_TRUST'}
            [IO.File]::WriteAllBytes($file,$validContent)
            Write-Output 'NF_PROTECTED_BUT_INVALID_PUBLIC_KEYS=DENIED'
            & icacls $file /grant '*S-1-5-32-545:M' | Out-Null
            if ($LASTEXITCODE -ne 0) {throw 'CANNOT_INJECT_FOREIGN_WRITER'}
            & pwsh -NoProfile -NonInteractive -File $script *> $null
            if ($LASTEXITCODE -eq 0) {throw 'FOREIGN_WINDOWS_WRITER_UNEXPECTEDLY_ACCEPTED'}
            Write-Output 'NF_OPERATOR_WINDOWS_FOREIGN_PUBLIC_TRUST_WRITER=DENIED'
          }
          finally {
            if ($created -and (Test-Path -LiteralPath $root)) {
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          # Expected denial runs leave PowerShell's LASTEXITCODE nonzero even
          # when assertions pass. Reset only after all security probes.
          $global:LASTEXITCODE=0
          exit 0
