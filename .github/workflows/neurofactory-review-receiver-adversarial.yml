name: Neurofactory REVIEW pinned CORE HOST receiver adversarial
on:
  push:
    branches: [neurofactory-review-owned-20261013]
    paths:
      - bridge/neurofactory/development/review_owned/test_receiver_race_review.py
      - .github/workflows/neurofactory-review-receiver-adversarial.yml
permissions:
  contents: read
jobs:
  independent-narrow-source-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nf_test
          POSTGRES_PASSWORD: nf_test_ephemeral_only
          POSTGRES_DB: nf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nf_test -d nf_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      NF_HOST_RECEIVER_FIXTURE_ONLY: "1"
      NF_CORE_OFFLINE_RECEIVER_TEST_ONLY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 5b7f8c48dc2f998f342ab9918f8828a815c4e73b
          path: _receiver_audit_source/coordinator
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 05ab48bf5b04818df2b632906886610587cad642
          path: _receiver_audit_source/coordinator/_e2e_fixture/core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 0c33d8181e102e2ca3f47559ae6abeb2f4b72757
          path: _receiver_audit_source/coordinator/_e2e_fixture/host
          persist-credentials: false
      - name: Isolated crypto and database client
        run: |
          python3 -m venv .nf-review-receiver
          .nf-review-receiver/bin/python -m pip install --disable-pip-version-check --no-input 'psycopg[binary]==3.2.6' 'cryptography==46.0.3'
      - name: REVIEW hostile receiver check and exact pinned source verification
        run: .nf-review-receiver/bin/python -B -m unittest discover -s bridge/neurofactory/development/review_owned -p 'test_receiver_race_review.py' -v
