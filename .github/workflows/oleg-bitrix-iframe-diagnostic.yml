name: Oleg Bitrix native iframe Playwright root-cause
on:
  push:
    branches: [audit-oleg-sites-playwright-20261115]
    paths: ['audits/oleg-indexing/bitrix_iframe_rootcause.cjs','.github/workflows/oleg-bitrix-iframe-diagnostic.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: audits/oleg-indexing
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real iframe and direct forms GET-only experience
        run: |
          node --check bitrix_iframe_rootcause.cjs
          node bitrix_iframe_rootcause.cjs
      - name: Diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oleg-bitrix-iframe-rootcause
          path: audits/oleg-indexing/oleg-bitrix-iframe-diagnostic.json
          if-no-files-found: warn
