name: Neurofactory TRUSTED HOST ephemeral effect reservation targeted
on:
  push:
    branches:
      - neurofactory-trusted-host-owned-20261015
    paths:
      - bridge/neurofactory/trusted_host/offline_effect_reservation.py
      - bridge/neurofactory/trusted_host/offline_effect_reservation_schema.sql
      - bridge/neurofactory/trusted_host/test_offline_effect_reservation.py
      - .github/workflows/neurofactory-trusted-host-owned-effect-reservation.yml
permissions:
  contents: read
jobs:
  offline-effect-reservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nf_test
          POSTGRES_PASSWORD: nf_test_ephemeral_only
          POSTGRES_DB: nf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nf_test -d nf_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      NF_EPHEMERAL_POSTGRES_DSN: postgresql://nf_test:nf_test_ephemeral_only@127.0.0.1:5432/nf_test
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ephemeral test-only psycopg
        run: |
          python3 -m venv .nf-effect-test-venv
          .nf-effect-test-venv/bin/python -m pip install --disable-pip-version-check --no-input 'psycopg[binary]==3.2.6'
      - name: Test OFFLINE intent reservation only; never write a project file
        run: .nf-effect-test-venv/bin/python -B -m unittest discover -s bridge/neurofactory/trusted_host -p 'test_offline_effect_reservation.py' -v
