name: Neurofactory OPS Candidate Read-only Diagnostics
on:
  push:
    branches:
      - neurofactory-ops-diagnostics-candidate-20261014
    paths:
      - 'bridge/neurofactory/ops_diagnostics/**'
      - '.github/workflows/neurofactory-ops-candidate-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neurofactory-ops-candidate-diagnostics
  cancel-in-progress: false
jobs:
  offline_linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only diagnostic unit tests on Linux
        env:
          PYTHONPATH: bridge/neurofactory/ops_diagnostics
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest discover -s bridge/neurofactory/ops_diagnostics -p 'test_*.py' -v
      - name: Diagnose an observed selective Stage5 snapshot without network writes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B bridge/neurofactory/ops_diagnostics/diagnose.py bridge/neurofactory/ops_diagnostics/examples/stage5_issue3_selected_evidence_20261014.json > "$RUNNER_TEMP/nf-ops-diagnostic.json"
          python3 -B -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/nf-ops-diagnostic.json")); assert d["release_authorized"] is False and d["diagnosis"]=="BLOCKED" and "BRANCH_PROTECTION_MISSING" in d["blockers"]'
      - name: Preserve only the isolated read-only diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurofactory-ops-candidate-readonly-diagnosis
          path: ${{ runner.temp }}/nf-ops-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
  offline_windows:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only diagnostic unit tests on isolated Windows hosted runner
        shell: pwsh
        env:
          PYTHONPATH: bridge/neurofactory/ops_diagnostics
          PYTHONDONTWRITEBYTECODE: '1'
        run: py -3 -B -m unittest discover -s bridge/neurofactory/ops_diagnostics -p 'test_*.py' -v
