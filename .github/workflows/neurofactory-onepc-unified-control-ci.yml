name: Neurofactory one-PC unified local Qwen draft plus signed CORE read-only boundary
on:
  push:
    branches: [neurofactory-onepc-unified-qwen-core-ui-20261020]
    paths:
      - bridge/neurofactory/one_pc_candidate/local_workspace.py
      - bridge/neurofactory/one_pc_candidate/core_readonly_observer.py
      - bridge/neurofactory/one_pc_candidate/signed_owner_admission.py
      - bridge/neurofactory/one_pc_candidate/test_core_readonly_observer.py
      - bridge/neurofactory/one_pc_candidate/test_signed_owner_admission.py
      - bridge/neurofactory/one_pc_candidate/test_draft_provider_workspace.py
      - bridge/neurofactory/control_ui/workspace.js
      - .github/workflows/neurofactory-onepc-unified-control-ci.yml
permissions:
  contents: read
jobs:
  unchanged-core-queue-telemetry:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Existing real CORE SQLite read-only observation with no execution rights
        run: python -B -m unittest discover -s bridge/neurofactory/one_pc_candidate -p test_core_readonly_observer.py -v
      - name: Existing Qwen user draft storage and no-replay negative cases
        run: python -B -m unittest discover -s bridge/neurofactory/one_pc_candidate -p test_draft_provider_workspace.py -v
      - name: No tracked working-tree mutations
        run: git diff --exit-code
  signed-core-no-live:
    runs-on: windows-2025
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install disposable CI Ed25519 validator only
        run: python -m pip install --disable-pip-version-check --no-input "cryptography==46.0.3"
      - name: Reuse actual owner Ed25519 admission and deny forged projects, signing from browser
        run: python -B -m unittest discover -s bridge/neurofactory/one_pc_candidate -p test_signed_owner_admission.py -v
      - name: Syntax-check exact unified local program only
        run: python -B -m py_compile bridge/neurofactory/one_pc_candidate/core_readonly_observer.py bridge/neurofactory/one_pc_candidate/signed_owner_admission.py bridge/neurofactory/one_pc_candidate/local_workspace.py
      - name: No tracked source mutations
        run: git diff --exit-code
