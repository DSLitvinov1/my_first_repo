name: Neurofactory coordinator private evidence metadata tests
on:
  push:
    branches:
      - neurofactory-coordinator-mvp-status-20261015
    paths:
      - bridge/neurofactory/coordination/mvp_provider_evidence_view.py
      - bridge/neurofactory/coordination/test_mvp_provider_evidence_view.py
      - .github/workflows/neurofactory-coordination-private-evidence-targeted.yml
permissions:
  contents: read
jobs:
  metadata-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run only eight new source-bound evidence checks
        run: python3 -B -m unittest discover -s bridge/neurofactory/coordination -p 'test_mvp_provider_evidence_view.py' -v
