name: Neurofactory genuine Windows SCM with separate local account and crash proof
on:
  push:
    branches: [neurofactory-windows-service-separated-sid-20261018]
    paths:
      - bridge/neurofactory/trusted_host/windows_scm_sandbox_receiver.py
      - bridge/neurofactory/trusted_host/windows_scm_ci_worker.py
      - bridge/neurofactory/trusted_host/test_windows_scm_two_user_recovery.py
      - .github/workflows/neurofactory-windows-scm-two-uid-recovery.yml
permissions:
  contents: read
jobs:
  ci-temporary-scm-two-user-effect:
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      NF_WINDOWS_SCM_DISPOSABLE_ONLY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: beb08eff32923d8ca364aabfde0458f380acf8e7
          path: .nf_pinned_core
          persist-credentials: false
      - name: Confirm immutable CORE executable SHA
        shell: pwsh
        run: |
          if ((git -C .nf_pinned_core rev-parse HEAD).Trim() -cne 'beb08eff32923d8ca364aabfde0458f380acf8e7') { throw 'CORE SHA mismatch' }
          if ((git -C .nf_pinned_core hash-object bridge/neurofactory/development/core_owned/one_task_core.py).Trim() -cne 'ab1471813c6da29407c913b974a2209467a4b961') { throw 'CORE blob mismatch' }
      - name: Install transient Python dependencies only on GitHub hosted Windows
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input "pywin32==311" "cryptography==46.0.3"
      - name: Real Windows SCM LocalService and non-admin SID signed CORE file, replay and crash
        shell: pwsh
        run: |
          python -B bridge/neurofactory/trusted_host/test_windows_scm_two_user_recovery.py
      - name: Ensure repository files unchanged
        shell: pwsh
        run: git diff --exit-code
