name: Oleg Playwright fresh production access and CRM UI audit
on:
  push:
    branches: [audit-oleg-sites-playwright-20261115]
    paths:
      - 'audits/oleg-indexing/production_current_readonly.cjs'
      - '.github/workflows/oleg-current-production-readonly.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  live-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: audits/oleg-indexing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Read-only live site and Bitrix forms audit on desktop and mobile
        run: |
          node --check production_current_readonly.cjs
          node production_current_readonly.cjs
      - name: Save diagnostics for both live domains
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oleg-current-production-playwright
          path: audits/oleg-indexing/oleg-production-current-readonly.json
          if-no-files-found: warn
