name: Neurofactory HOST isolated signer and out-of-DB monotonic anchor
on:
  push:
    branches:
      - neurofactory-trusted-host-owned-20261015
    paths:
      - bridge/neurofactory/trusted_host/offline_operator_anchor.py
      - bridge/neurofactory/trusted_host/test_offline_operator_anchor.py
      - .github/workflows/neurofactory-trusted-host-owned-os-anchor.yml
permissions:
  contents: read
jobs:
  isolated-signer-antirollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nf_test
          POSTGRES_PASSWORD: nf_test_ephemeral_only
          POSTGRES_DB: nf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nf_test -d nf_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      NF_OPERATOR_ANCHOR_FIXTURE_ONLY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create disposable different Linux UID identities
        run: |
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin nf_signer
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin nf_db_actor
          echo "SIGNER_UID=$(id -u nf_signer)"
          echo "DB_ACTOR_UID=$(id -u nf_db_actor)"
          test "$(id -u nf_signer)" != "$(id -u nf_db_actor)"
          test "$(id -u)" != "$(id -u nf_signer)"
      - name: Install isolated no-paid-API dependencies
        run: |
          python3 -m venv /tmp/nf-operator-test-venv
          /tmp/nf-operator-test-venv/bin/python -m pip install --no-input --disable-pip-version-check "psycopg[binary]==3.2.6" cryptography==46.0.3
          mkdir -p /tmp/nf-operator-source
          cp bridge/neurofactory/trusted_host/offline_operator_anchor.py /tmp/nf-operator-source/operator.py
      - name: Run external signer key custody and PostgreSQL rollback negatives
        run: |
          git rev-parse HEAD
          NF_OPERATOR_TEST_SOURCE="/tmp/nf-operator-source/operator.py" NF_OPERATOR_TEST_PYTHON="/tmp/nf-operator-test-venv/bin/python" /tmp/nf-operator-test-venv/bin/python -B -m unittest discover -s bridge/neurofactory/trusted_host -p 'test_offline_operator_anchor.py' -v
