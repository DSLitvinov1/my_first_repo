name: Neurofactory one-PC genuine CORE SQLite read-only projection tests
on:
  push:
    branches: [neurofactory-onepc-core-readonly-ui-20261019]
    paths:
      - bridge/neurofactory/one_pc_candidate/core_readonly_observer.py
      - bridge/neurofactory/one_pc_candidate/local_workspace.py
      - bridge/neurofactory/one_pc_candidate/test_core_readonly_observer.py
      - bridge/neurofactory/control_ui/workspace.js
      - .github/workflows/neurofactory-onepc-core-readonly.yml
  pull_request:
    branches: [neurofactory-onepc-provider-runtime-import-20261019]
permissions:
  contents: read
jobs:
  read-real-core-no-live:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test actual existing CORE SQLite enqueue/claim against readonly local HTTP
        run: python -B -m unittest discover -s bridge/neurofactory/one_pc_candidate -p test_core_readonly_observer.py -v
      - name: Compile only changed local Python files
        run: python -B -m py_compile bridge/neurofactory/one_pc_candidate/core_readonly_observer.py bridge/neurofactory/one_pc_candidate/local_workspace.py
      - name: Confirm no committed source modified by tests
        run: git diff --exit-code
