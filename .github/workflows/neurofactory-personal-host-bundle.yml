name: Neurofactory personal Windows SCM host and remote highwater deployable bundle
on:
  push:
    branches: [neurofactory-p0-personal-windows-host-remote-highwater-20261105, neurofactory-personal-core-qwen-host-projectfiles-20261106]
    paths:
      - 'bridge/neurofactory/one_pc_candidate/personal_ssh_highwater.py'
      - 'bridge/neurofactory/one_pc_candidate/personal_ssh_highwater_client.py'
      - 'bridge/neurofactory/one_pc_candidate/personal_scoped_ssh_transport.py'
      - 'bridge/neurofactory/one_pc_candidate/personal_windows_host_service.py'
      - 'bridge/neurofactory/one_pc_candidate/personal_project_file_effect.py'
      - 'bridge/neurofactory/one_pc_candidate/personal_core_qwen_file_approval.py'
      - 'bridge/neurofactory/one_pc_candidate/test_personal_project_file_capability.py'
      - 'bridge/neurofactory/one_pc_candidate/personal_approve_workspace_draft.py'
      - 'bridge/neurofactory/one_pc_candidate/provision_personal_linux_witness.py'
      - 'bridge/neurofactory/one_pc_candidate/personal_approve_safe_note.py'
      - 'bridge/neurofactory/one_pc_candidate/windows_setup/Prepare-NeurofactoryPersonalHost.ps1'
      - 'bridge/neurofactory/one_pc_candidate/windows_setup/Start-NeurofactoryPersonalHost.ps1'
      - 'bridge/neurofactory/one_pc_candidate/windows_setup/Provision-NeurofactoryPersonalProjectFolder.ps1'
      - 'bridge/neurofactory/one_pc_candidate/windows_setup/Verify-NeurofactoryAfterWindowsReboot.ps1'
      - '.github/workflows/neurofactory-personal-host-bundle.yml'
permissions:
  contents: read
jobs:
  assemble_personal_runtime:
    runs-on: windows-2025
    timeout-minutes: 17
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assemble isolated protected host runtime from pinned CPython
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'NO_OWNER_PC_BUILD' }
          $root=Join-Path $env:RUNNER_TEMP 'NFPersonalHostStage'
          if (Test-Path $root) {throw 'BUNDLE_STAGE_EXISTS'}
          New-Item -ItemType Directory "$root/runtime","$root/service","$root/installer" -Force|Out-Null
          $vendor=Join-Path $env:RUNNER_TEMP 'python-3.12.10-embedded.zip'
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile $vendor -MaximumRedirection 2
          if ((Get-Item $vendor).Length -ne 11133606 -or (Get-FileHash $vendor -Algorithm SHA256).Hash -cne '4ACBED6DD1C744B0376E3B1CF57CE906F9DC9E95E68824584C8099A63025A3C3') {throw 'CPYTHON_VENDOR_PIN_CHANGED'}
          Expand-Archive -LiteralPath $vendor -DestinationPath "$root/runtime"
          $site="$root/runtime/Lib/site-packages"
          New-Item -ItemType Directory $site -Force|Out-Null
          $wheels=Join-Path $env:RUNNER_TEMP 'nf-personal-wheels'
          New-Item -ItemType Directory $wheels|Out-Null
          python -m pip download --disable-pip-version-check --no-input --only-binary=:all: --platform win_amd64 --python-version 312 --implementation cp --abi cp312 -d $wheels 'pywin32==311' 'cryptography==46.0.3' 'paramiko==4.0.0' 'bcrypt==5.0.0' 'PyNaCl==1.6.2' 'invoke==3.0.3'
          if ($LASTEXITCODE -ne 0) {throw 'REQUIRED_WINDOWS_CRYPTO_WIN32_WHEELS_NOT_AVAILABLE'}
          foreach ($wheel in @(Get-ChildItem $wheels -File -Filter '*.whl')) {
              $tmp=Join-Path $env:RUNNER_TEMP ("wheel-"+[guid]::NewGuid().ToString('N'))
              $zip="$tmp.zip"
              Copy-Item $wheel.FullName $zip
              Expand-Archive -LiteralPath $zip -DestinationPath $site
          }
          @('python312.zip','.','../service','Lib/site-packages','Lib/site-packages/win32','Lib/site-packages/win32/lib','Lib/site-packages/pywin32_system32','import site') | Set-Content "$root/runtime/python312._pth" -Encoding ascii
          foreach ($file in @('personal_ssh_highwater.py','personal_ssh_highwater_client.py','personal_scoped_ssh_transport.py','personal_windows_host_service.py','personal_approve_safe_note.py','personal_approve_workspace_draft.py','personal_project_file_effect.py','personal_core_qwen_file_approval.py')) {
              Copy-Item "bridge/neurofactory/one_pc_candidate/$file" "$root/service/$file"
          }
          foreach ($file in @('Prepare-NeurofactoryPersonalHost.ps1','Start-NeurofactoryPersonalHost.ps1','Provision-NeurofactoryPersonalProjectFolder.ps1','Verify-NeurofactoryAfterWindowsReboot.ps1')) {
              Copy-Item "bridge/neurofactory/one_pc_candidate/windows_setup/$file" "$root/installer/$file"
          }
          & "$root/runtime/python.exe" -B -c 'import win32service,win32serviceutil,win32event,servicemanager,cryptography,paramiko,bcrypt,nacl;import personal_ssh_highwater,personal_scoped_ssh_transport,personal_ssh_highwater_client,personal_windows_host_service,personal_approve_safe_note,personal_approve_workspace_draft,personal_project_file_effect,personal_core_qwen_file_approval;print("NF_PERSONAL_SEALED_WIN32_SCM_RUNTIME_IMPORT=PASS")'
          if ($LASTEXITCODE -ne 0) {throw 'PERSONAL_HOST_EMBEDDED_RUNTIME_IMPORT_FAILED'}
          & "$root/runtime/python.exe" -B -m compileall -q "$root/service"
          if ($LASTEXITCODE -ne 0) {throw 'PERSONAL_HOST_CODE_COMPILE_FAILED'}
          # One focused physical-Windows-API compatible regression only.
          & "$root/runtime/python.exe" -B -m unittest discover -s "bridge/neurofactory/one_pc_candidate" -p "test_personal_project_file_capability.py" -v
          if ($LASTEXITCODE -ne 0) {throw 'CORE_QWEN_PROJECT_FILE_OWNER_SIGNATURE_REGRESSION'}
          $records=@(Get-ChildItem $root -File -Recurse | Where-Object {$_.Name -ne 'bundle-manifest.json'} | Sort-Object FullName | ForEach-Object {
              [ordered]@{
                  path=$_.FullName.Substring($root.Length+1).Replace('\','/')
                  sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                  bytes=$_.Length
              }
          })
          [ordered]@{
              schema='nf.personal.scoped_host_unsigned_bundle.v1'
              source_sha40=$env:GITHUB_SHA
              scope='SELF_MANAGED_OWNER_REVIEWED_PROJECT_FILES'
              publisher_signed=$false
              independent_operator_verified=$false
              protected_service_installed=$false
              entries=$records
          } | ConvertTo-Json -Depth 8 | Set-Content "$root/bundle-manifest.json" -Encoding utf8
          Write-Output ('NF_PERSONAL_RUNTIME_STAGE_SOURCE='+$env:GITHUB_SHA)
          Write-Output ('NF_PERSONAL_RUNTIME_FILES='+$records.Count)
      - name: Upload uninstalled, auditable bundle (never includes private keys)
        uses: actions/upload-artifact@v4
        with:
          name: Neurofactory-Personal-Host-Runtime-UNSIGNED-NOT-INSTALLED
          path: ${{ runner.temp }}/NFPersonalHostStage/**
          if-no-files-found: error
          retention-days: 14
