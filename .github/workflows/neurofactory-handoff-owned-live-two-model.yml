name: Neurofactory HANDOFF Real Free Two-Model Isolation
# Retry after strict structured Qwen3 verdict and raw response evidence hardening.
on:
  push:
    branches:
      - neurofactory-model-handoff-owned-20261013
    paths:
      - '.github/workflows/neurofactory-handoff-owned-live-two-model.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neurofactory-handoff-only-real-model-laboratory
  cancel-in-progress: false
jobs:
  offline_acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independent deterministic owned tests first
        env:
          PYTHONPATH: bridge/neurofactory/development
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B -m unittest discover -s bridge/neurofactory/development/model_handoff_owned -p 'test_*.py' -v
          python3 -B bridge/neurofactory/coordination/check_lanes.py --check-policy
  real_two_models:
    needs: offline_acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout isolated branch without preserving GitHub credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Ollama on disposable no-cost public repository runner
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh -o "$RUNNER_TEMP/ollama-install.sh"
          bash "$RUNNER_TEMP/ollama-install.sh"
          ollama serve > "$RUNNER_TEMP/neurofactory-handoff-ollama.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
      - name: Acquire only two specified local free model weights, sequentially
        shell: bash
        run: |
          set -euo pipefail
          ollama pull qwen2.5-coder:7b
          ollama pull qwen3:4b
      - name: Actual Qwen2.5 candidate, exact Qwen3 handoff, Qwen3 module review
        shell: bash
        env:
          PYTHONPATH: bridge/neurofactory/development
          PYTHONDONTWRITEBYTECODE: '1'
          OLLAMA_NUM_PARALLEL: '1'
          OLLAMA_MAX_LOADED_MODELS: '1'
        run: |
          python3 -B -m model_handoff_owned.live_two_model_trial
      - name: Preserve scoped evidence and failure checkpoint, never publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurofactory-handoff-owned-q090-evidence
          path: ${{ runner.temp }}/neurofactory-handoff-live-q090/
          if-no-files-found: warn
          retention-days: 14
