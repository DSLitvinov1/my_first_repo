name: Neurofactory HANDOFF Owned Candidate Review Gate
on:
  push:
    branches:
      - neurofactory-model-handoff-owned-20261013
    paths:
      - 'bridge/neurofactory/development/model_handoff_owned/**'
      - '.github/workflows/neurofactory-handoff-owned-model-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neurofactory-handoff-owned-model-gate
  cancel-in-progress: false
jobs:
  isolated_handoff_unit_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify owner and forbid foreign files
        env:
          PYTHONPATH: bridge/neurofactory/coordination
        run: |
          python3 -B bridge/neurofactory/coordination/check_lanes.py --check-policy
          python3 - <<'PY'
          from check_lanes import check_change_set,load_policy
          check_change_set("handoff", [
            "bridge/neurofactory/development/model_handoff_owned/handoff_gate.py",
            "bridge/neurofactory/development/model_handoff_owned/test_handoff_gate.py",
            ".github/workflows/neurofactory-handoff-owned-model-gate.yml"
          ], load_policy())
          print("HANDOFF_OWNERSHIP_OK")
          PY
      - name: Candidate to independent reviewer safety regression suite
        env:
          PYTHONPATH: bridge/neurofactory/development
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest discover -s bridge/neurofactory/development/model_handoff_owned -p 'test_*.py' -v

  isolated_windows_fail_closed:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Windows refusal to store untrusted evidence without native secure handles
        shell: pwsh
        env:
          PYTHONPATH: bridge/neurofactory/development
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          py -3 -B -m unittest discover -s bridge/neurofactory/development/model_handoff_owned -p test_security_remediation.py -v
