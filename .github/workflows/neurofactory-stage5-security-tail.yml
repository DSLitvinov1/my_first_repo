name: Neurofactory Stage5 Remaining Independent Qwen Review
on:
  push:
    branches: [neurofactory-stage5-security-check-20261013]
    paths:
      - '.github/workflows/neurofactory-stage5-security-tail.yml'
permissions:
  contents: read
concurrency:
  group: neurofactory-stage5-security-tail
  cancel-in-progress: false
jobs:
  independent_remaining_security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start free local Qwen3 without GitHub publication access
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > "$RUNNER_TEMP/nf5-tail.log" 2>&1 &)
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3:4b
      - name: Review remaining three entire modules and save each independent verdict
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OLLAMA_NUM_PARALLEL: '1'
          OLLAMA_MAX_LOADED_MODELS: '1'
        run: python -B bridge/neurofactory/development/stage5_independent_security_tail.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neurofactory-stage5-independent-full-review
          path: bridge/neurofactory/development/stage5-security-tail-verdict.json
          if-no-files-found: warn
